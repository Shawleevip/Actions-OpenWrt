name: OpenWrt 25.12 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_BRANCH: openwrt-25.12
  OPENWRT_DIR: openwrt
  TZ: Asia/Shanghai

jobs:

  build:
    name: OpenWrt 25.12 x86_64
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout build repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Maximize disk space
      # ============================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192

          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ============================================================
      # 3. Install build dependencies
      # ============================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive

        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc \
            zstd

          sudo timedatectl set-timezone Asia/Shanghai


      # ============================================================
      # 4. Build information
      # ============================================================

      - name: Set build information
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"


      # ============================================================
      # 5. Restore ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-25.12-x86_64-${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}
          restore-keys: |
            openwrt-25.12-x86_64-${{ runner.os }}-ccache-


      # ============================================================
      # 6. Clone official OpenWrt
      # ============================================================

      - name: Clone official OpenWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$OPENWRT_BRANCH" \
            https://github.com/openwrt/openwrt.git \
            "$OPENWRT_DIR"

          cd "$OPENWRT_DIR"

          echo "========================================"
          echo "OpenWrt source"
          echo "========================================"

          git log -1 --oneline
          git describe --always --dirty

          echo "========================================"


      # ============================================================
      # 7. Restore download cache
      # ============================================================

      - name: Restore OpenWrt download cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl

          key: openwrt-25.12-x86_64-dl-${{ runner.os }}-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}

          restore-keys: |
            openwrt-25.12-x86_64-dl-${{ runner.os }}-


      # ============================================================
      # 8. Add third-party feeds
      #
      # Official feeds remain untouched.
      #
      # PassWall2 requires:
      #   passwall
      #   passwall_packages
      #   passwall2
      #
      # sbwml provides:
      #   vlmcsd
      #   luci-app-vlmcsd
      #   rtp2httpd
      #   luci-app-rtp2httpd
      # ============================================================

      - name: Configure third-party feeds
        working-directory: ./openwrt
        run: |
          cat >> feeds.conf.default <<'EOF'

          # ========================================================
          # PassWall2
          # ========================================================

          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main

          # ========================================================
          # sbwml package collection
          # ========================================================

          src-git sbwml https://github.com/sbwml/openwrt_pkgs.git;main

          EOF

          echo "========================================"
          echo "feeds.conf.default"
          echo "========================================"

          cat feeds.conf.default


      # ============================================================
      # 9. Update official + third-party feeds
      # ============================================================

      - name: Update feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ============================================================
      # 10. Add OpenClash
      # ============================================================

      - name: Add OpenClash
        working-directory: ./openwrt
        run: |
          rm -rf package/luci-app-openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            package/luci-app-openclash

          echo "OpenClash installed."


      # ============================================================
      # 11. Add Lucky
      # ============================================================

      - name: Add Lucky
        working-directory: ./openwrt
        run: |
          rm -rf package/lucky

          git clone \
            --depth 1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky

          echo "Lucky installed."


      # ============================================================
      # 12. Add Argon
      # ============================================================

      - name: Add Argon
        working-directory: ./openwrt
        run: |
          rm -rf \
            package/luci-theme-argon \
            package/luci-app-argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config

          echo "Argon installed."


      # ============================================================
      # 13. Add Diskman
      # ============================================================

      - name: Add Diskman
        working-directory: ./openwrt
        run: |
          rm -rf package/diskman

          git clone \
            --depth 1 \
            https://github.com/lisaac/luci-app-diskman.git \
            package/diskman

          echo "Diskman installed."


      # ============================================================
      # 14. Prepare package links
      # ============================================================

      - name: Prepare packages
        working-directory: ./openwrt
        run: |
          make package/symlinks


      # ============================================================
      # 15. Generate configuration
      # ============================================================

      - name: Generate configuration
        working-directory: ./openwrt

        run: |

          rm -f .config

          cat > .config <<'EOF'

          # ========================================================
          # TARGET
          # ========================================================

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y


          # ========================================================
          # FIRMWARE
          # ========================================================

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640

          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y


          # ========================================================
          # LUCi
          # ========================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-package-manager=y


          # ========================================================
          # IPv6
          # ========================================================

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y


          # ========================================================
          # FILESYSTEM
          # ========================================================

          CONFIG_PACKAGE_kmod-fs-nfs=y
          CONFIG_PACKAGE_kmod-fs-nfs-common=y
          CONFIG_PACKAGE_kmod-fs-nfs-v3=y
          CONFIG_PACKAGE_kmod-fs-nfs-v4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y


          # ========================================================
          # USB
          # ========================================================

          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ohci-pci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb2-pci=y
          CONFIG_PACKAGE_kmod-usb3=y


          # ========================================================
          # BONDING
          # ========================================================

          CONFIG_PACKAGE_kmod-bonding=y


          # ========================================================
          # SQM / CAKE
          # ========================================================

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y


          # ========================================================
          # OPENVPN
          # ========================================================

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y


          # ========================================================
          # WIREGUARD
          # ========================================================

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y


          # ========================================================
          # OPENCLASH
          # ========================================================

          CONFIG_PACKAGE_luci-app-openclash=y

          # OpenClash TProxy / nftables support
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y


          # ========================================================
          # PASSWALL2
          # ========================================================

          CONFIG_PACKAGE_luci-app-passwall2=y


          # ========================================================
          # PASSWALL / SING-BOX SUPPORT
          # ========================================================

          CONFIG_PACKAGE_sing-box=y


          # ========================================================
          # LUCKY
          # ========================================================

          CONFIG_PACKAGE_luci-app-lucky=y


          # ========================================================
          # RTP2HTTPD
          # ========================================================

          CONFIG_PACKAGE_rtp2httpd=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y


          # ========================================================
          # VLMCSd / KMS
          # ========================================================

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          # ========================================================
          # ARGON
          # ========================================================

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y


          # ========================================================
          # DISKMAN
          # ========================================================

          CONFIG_PACKAGE_luci-app-diskman=y


          # ========================================================
          # IRQBALANCE
          # ========================================================

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y


          # ========================================================
          # TTYD
          # ========================================================

          CONFIG_PACKAGE_luci-app-ttyd=y


          # ========================================================
          # NETWORK TOOLS
          # ========================================================

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_wget-ssl=y

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_wget=y

          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y

          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y

          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y

          CONFIG_PACKAGE_bind-host=y


          # ========================================================
          # FIREWALL
          # ========================================================

          CONFIG_PACKAGE_firewall4=y


          # ========================================================
          # CCACHE
          # ========================================================

          CONFIG_CCACHE=y

          EOF


          # ========================================================
          # Resolve dependencies
          # ========================================================

          make defconfig


          # ========================================================
          # Show selected packages
          # ========================================================

          echo ""
          echo "========================================"
          echo "Selected packages"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|luci-app-lucky|luci-app-rtp2httpd|rtp2httpd|vlmcsd|luci-app-vlmcsd|luci-app-sqm|openvpn-openssl|openvpn-easy-rsa|wireguard-tools|luci-theme-argon|luci-app-argon-config|sing-box|luci-app-package-manager)' \
            .config \
            || true


      # ============================================================
      # 16. Validate required packages
      # ============================================================

      - name: Validate selected packages
        working-directory: ./openwrt
        run: |

          set -e

          REQUIRED_PACKAGES="
          luci-app-openclash
          luci-app-passwall2
          luci-app-lucky
          luci-app-rtp2httpd
          rtp2httpd
          vlmcsd
          luci-app-vlmcsd
          luci-app-sqm
          openvpn-openssl
          openvpn-easy-rsa
          wireguard-tools
          luci-theme-argon
          luci-app-argon-config
          luci-app-package-manager
          sing-box
          "

          echo "========================================"
          echo "Validating selected packages"
          echo "========================================"

          for pkg in $REQUIRED_PACKAGES; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "[ OK ] $pkg"
            else
              echo "[FAIL] $pkg"
              exit 1
            fi
          done

          echo ""
          echo "All required packages are selected."


      # ============================================================
      # 17. Check build prerequisites
      # ============================================================

      - name: Check prerequisites
        working-directory: ./openwrt
        run: |
          make prereq


      # ============================================================
      # 18. Download sources
      # ============================================================

      - name: Download sources
        working-directory: ./openwrt
        run: |
          make download -j8 V=s


      # ============================================================
      # 19. Compile firmware
      # ============================================================

      - name: Compile firmware
        working-directory: ./openwrt

        run: |

          echo "========================================"
          echo "OpenWrt build started"
          echo "$BUILD_TIME"
          echo "========================================"

          make -j$(nproc) || \
          make -j1 V=s

          echo "========================================"
          echo "OpenWrt build finished"
          echo "========================================"

          date


      # ============================================================
      # 20. Verify firmware
      # ============================================================

      - name: Verify firmware
        working-directory: ./openwrt

        run: |

          set -e

          TARGET_DIR="bin/targets/x86/64"

          echo "========================================"
          echo "Generated images"
          echo "========================================"

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


          EFI_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*generic-squashfs-combined-efi.img.gz' \
            | head -n 1)"


          if [ -z "$EFI_IMAGE" ]; then

            echo ""
            echo "ERROR: EFI image not found!"
            echo ""

            find "$TARGET_DIR" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n'

            exit 1

          fi


          echo ""
          echo "========================================"
          echo "EFI image found"
          echo "========================================"

          echo "$EFI_IMAGE"


      # ============================================================
      # 21. Prepare artifacts
      # ============================================================

      - name: Prepare artifacts
        working-directory: ./openwrt

        run: |

          set -e

          TARGET_DIR="bin/targets/x86/64"

          rm -rf artifact

          mkdir -p \
            artifact/firmware \
            artifact/apk \
            artifact/buildinfo \
            artifact/packages


          # ========================================================
          # EFI ONLY
          # ========================================================

          EFI_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*generic-squashfs-combined-efi.img.gz' \
            | head -n 1)"

          cp "$EFI_IMAGE" \
            "artifact/firmware/OpenWrt-25.12-x86-64-SquashFS-UEFI-${BUILD_DATE}.img.gz"


          # ========================================================
          # SHA256
          # ========================================================

          cd artifact/firmware

          sha256sum *.img.gz > SHA256SUMS

          cd ../..


          # ========================================================
          # APK
          # ========================================================

          if [ -d bin/packages ]; then

            find bin/packages \
              -type f \
              -name '*.apk' \
              -exec cp -f {} artifact/apk/ \;

          fi


          # ========================================================
          # Complete package repository
          # ========================================================

          if [ -d bin/packages ]; then

            tar \
              -C bin \
              -czf \
              artifact/packages/OpenWrt-25.12-x86-64-packages-${BUILD_DATE}.tar.gz \
              packages

          fi


          # ========================================================
          # Buildinfo / Manifest
          # ========================================================

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.buildinfo' \
              -o \
              -name '*.manifest' \
            \) \
            -exec cp {} artifact/buildinfo/ \;


          # ========================================================
          # Build summary
          # ========================================================

          echo ""
          echo "========================================"
          echo "Firmware"
          echo "========================================"

          ls -lh artifact/firmware


          echo ""
          echo "========================================"
          echo "APK packages"
          echo "========================================"

          find artifact/apk \
            -type f \
            -name '*.apk' \
            -printf '%f\n' \
            | sort


          echo ""
          echo "========================================"
          echo "Buildinfo"
          echo "========================================"

          ls -lh artifact/buildinfo || true


          echo ""
          echo "========================================"
          echo "Complete package repository"
          echo "========================================"

          ls -lh artifact/packages || true


      # ============================================================
      # 22. Upload EFI firmware
      # ============================================================

      - name: Upload EFI firmware
        uses: actions/upload-artifact@v4

        with:
          name: OpenWrt-25.12-x86-64-UEFI-${{ env.BUILD_DATE }}

          path: |
            ./openwrt/artifact/firmware/*

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # 23. Upload APK
      # ============================================================

      - name: Upload APK packages
        uses: actions/upload-artifact@v4

        with:
          name: OpenWrt-25.12-x86-64-APK-${{ env.BUILD_DATE }}

          path: |
            ./openwrt/artifact/apk/*.apk

          if-no-files-found: warn

          retention-days: 30


      # ============================================================
      # 24. Upload complete package repository
      # ============================================================

      - name: Upload complete package repository
        uses: actions/upload-artifact@v4

        with:
          name: OpenWrt-25.12-x86-64-Packages-${{ env.BUILD_DATE }}

          path: |
            ./openwrt/artifact/packages/*

          if-no-files-found: warn

          retention-days: 30


      # ============================================================
      # 25. Upload build information
      # ============================================================

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4

        with:
          name: OpenWrt-25.12-x86-64-BuildInfo-${{ env.BUILD_DATE }}

          path: |
            ./openwrt/artifact/buildinfo/*

          if-no-files-found: warn

          retention-days: 30
