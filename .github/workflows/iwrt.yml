name: Build ImmortalWrt x86_64

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload to GitHub Release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write # 需要写入权限以创建 Release

env:
  IMMORTAL_REF: master
  IMMORTAL_DIR: immortalwrt
  TZ: Asia/Shanghai

jobs:
  build:
    name: ImmortalWrt x86_64 Build
    runs-on: ubuntu-22.04

    steps:
      # ==========================================================
      # 1. Checkout 当前仓库
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 最大化构建空间 (清理无用环境)
      # ==========================================================
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # ==========================================================
      # 3. 安装编译依赖
      # ==========================================================
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php || true
          sudo apt-get update
          sudo apt-get install -y \
            ack asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man \
            intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev scdoc zstd
          sudo timedatectl set-timezone Asia/Shanghai

      # ==========================================================
      # 4. 设置构建时间变量
      # ==========================================================
      - name: Set build information
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      # ==========================================================
      # 5. 恢复 CCache 缓存 (加速二次编译)
      # ==========================================================
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: immortalwrt-x86_64-${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            immortalwrt-x86_64-${{ runner.os }}-ccache-

      # ==========================================================
      # 6. 克隆 ImmortalWrt 源码
      # ==========================================================
      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 --branch "$IMMORTAL_REF" https://github.com/immortalwrt/immortalwrt.git "$IMMORTAL_DIR"
          cd "$IMMORTAL_DIR"
          echo "Source Version: $(git describe --always --dirty)"

      # ==========================================================
      # 7. 恢复下载缓存 (dl 目录)
      # ==========================================================
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: immortalwrt-x86_64-${{ runner.os }}-dl-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            immortalwrt-x86_64-${{ runner.os }}-dl-

      # ==========================================================
      # 8. 配置第三方 Feeds (修正了 PassWall 源)
      # ==========================================================
      - name: Configure feeds
        working-directory: ./immortalwrt
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main
          src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/xiaorouji/openwrt-passwall2.git;master
          EOF

      # ==========================================================
      # 9. 更新并安装 Feeds
      # ==========================================================
      - name: Update and install feeds
        working-directory: ./immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================================
      # 10. 冻结第三方 Feeds (防止运行时拉取)
      # ==========================================================
      - name: Freeze third-party feeds
        working-directory: ./immortalwrt
        run: |
          sed -i -e '/^src-git passwall /d' -e '/^src-git passwall_packages /d' -e '/^src-git passwall2 /d' feeds.conf.default

      # ==========================================================
      # 11. 克隆自定义插件 (优化了克隆逻辑)
      # ==========================================================
      - name: Add OpenClash
        working-directory: ./immortalwrt
        run: |
          rm -rf package/luci-app-openclash
          git clone --depth 1 https://github.com/vernesong/OpenClash.git package/luci-app-openclash

      - name: Add Lucky
        working-directory: ./immortalwrt
        run: |
          rm -rf package/lucky package/luci-app-lucky
          git clone --depth 1 https://github.com/sirpdboy/luci-app-lucky.git package/lucky-temp
          cp -a package/lucky-temp/lucky package/lucky
          cp -a package/lucky-temp/luci-app-lucky package/luci-app-lucky
          rm -rf package/lucky-temp

      - name: Add RTP2HTTPD
        working-directory: ./immortalwrt
        run: |
          rm -rf package/rtp2httpd
          git clone --depth 1 https://github.com/stackia/rtp2httpd.git package/rtp2httpd

      - name: Add Vlmcsd (KMS)
        working-directory: ./immortalwrt
        run: |
          rm -rf package/vlmcsd package/luci-app-vlmcsd
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/sbwml/openwrt_pkgs.git /tmp/sbwml
          cd /tmp/sbwml && git sparse-checkout init --cone && git sparse-checkout set vlmcsd luci-app-vlmcsd && git checkout
          cp -a /tmp/sbwml/vlmcsd package/vlmcsd
          cp -a /tmp/sbwml/luci-app-vlmcsd package/luci-app-vlmcsd
          rm -rf /tmp/sbwml

      - name: Add Argon Theme
        working-directory: ./immortalwrt
        run: |
          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config

      - name: Add Diskman
        working-directory: ./immortalwrt
        run: |
          rm -rf package/diskman
          git clone --depth 1 https://github.com/lisaac/luci-app-diskman.git package/diskman

      # ==========================================================
      # 12. 准备包符号链接
      # ==========================================================
      - name: Prepare package symlinks
        working-directory: ./immortalwrt
        run: make package/symlinks

      # ==========================================================
      # 13. 生成 .config 配置文件 (已去重并整理)
      # ==========================================================
      - name: Generate configuration
        working-directory: ./immortalwrt
        run: |
          rm -f .config
          cat > .config <<'EOF'
          # 目标架构
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          
          # 固件分区与格式 (EFI 启动)
          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_GRUB_EFI_IMAGES=y
          
          # LuCI 基础与中文
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          
          # IPv6 支持
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          
          # 文件系统 (NFS, NTFS3)
          CONFIG_PACKAGE_kmod-fs-nfs=y
          CONFIG_PACKAGE_kmod-fs-nfs-common=y
          CONFIG_PACKAGE_kmod-fs-nfs-v3=y
          CONFIG_PACKAGE_kmod-fs-nfs-v4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          
          # USB 支持
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ohci-pci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb2-pci=y
          CONFIG_PACKAGE_kmod-usb3=y
          
          # 网卡聚合
          CONFIG_PACKAGE_kmod-bonding=y
          
          # SQM / CAKE 流量控制
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y
          
          # OpenVPN
          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y
          
          # WireGuard
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          
          # OpenClash 及其依赖
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          
          # PassWall2 及其依赖
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          
          # Lucky
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_lucky=y
          
          # RTP2HTTPD
          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          CONFIG_PACKAGE_rtp2httpd=y
          
          # Vlmcsd (KMS 激活)
          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          
          # Argon 主题
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          
          # Diskman (磁盘管理)
          CONFIG_PACKAGE_luci-app-diskman=y
          
          # UPnP
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          
          # IRQ 负载均衡
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          
          # TTYD (网页终端)
          CONFIG_PACKAGE_luci-app-ttyd=y
          
          # 常用网络与诊断工具
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y
          
          # ESXi 虚拟机工具
          CONFIG_PACKAGE_open-vm-tools=y
          
          # 防火墙 (fw4)
          CONFIG_PACKAGE_firewall4=y
          
          # 启用 CCache 加速
          CONFIG_CCACHE=y
          EOF
          make defconfig

      # ==========================================================
      # 14. 检查先决条件
      # ==========================================================
      - name: Check prerequisites
        working-directory: ./immortalwrt
        run: make prereq

      # ==========================================================
      # 15. 下载源码包
      # ==========================================================
      - name: Download sources
        working-directory: ./immortalwrt
        run: make download -j8 V=s

      # ==========================================================
      # 16. 编译固件
      # ==========================================================
      - name: Compile firmware
        working-directory: ./immortalwrt
        run: |
          echo "========================================"
          echo "Build Start: $BUILD_TIME"
          echo "========================================"
          make -j$(nproc) || make -j1 V=s
          echo "========================================"
          echo "Build Finished"
          echo "========================================"

      # ==========================================================
      # 17. 整理产物 (同时提取 img.gz 和 img)
      # ==========================================================
      - name: Prepare artifacts
        working-directory: ./immortalwrt
        run: |
          set -e
          TARGET="bin/targets/x86/64"
          rm -rf artifact
          mkdir -p artifact/firmware artifact/buildinfo
          
          # 查找 EFI 镜像
          EFI_GZ="$(find "$TARGET" -maxdepth 1 -type f -name '*generic-squashfs-combined-efi.img.gz' | head -n 1)"
          EFI_IMG="$(find "$TARGET" -maxdepth 1 -type f -name '*generic-squashfs-combined-efi.img' | head -n 1)"
          
          if [ -n "$EFI_GZ" ]; then
            cp "$EFI_GZ" "artifact/firmware/ImmortalWrt-x86-64-UEFI-${BUILD_DATE}.img.gz"
          fi
          
          if [ -n "$EFI_IMG" ]; then
            cp "$EFI_IMG" "artifact/firmware/ImmortalWrt-x86-64-UEFI-${BUILD_DATE}.img"
          fi
          
          cd artifact/firmware
          sha256sum * > SHA256SUMS
          cd ../..
          
          cp .config artifact/buildinfo/config.final
          git log -1 --format=fuller > artifact/buildinfo/source.commit
          git describe --always --dirty > artifact/buildinfo/source.version
          
          find "$TARGET" -maxdepth 1 -type f \( -name '*.buildinfo' -o -name '*.manifest' \) -exec cp {} artifact/buildinfo/ \;

      # ==========================================================
      # 18. 上传至 GitHub Actions Artifacts (临时存储)
      # ==========================================================
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-x86-64-Firmware-${{ env.BUILD_DATE }}
          path: ./immortalwrt/artifact/firmware/*
          retention-days: 7

      # ==========================================================
      # 19. 上传至 GitHub Release (永久存储，可选)
      # ==========================================================
      - name: Create Release
        if: github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.BUILD_DATE }}
          name: ImmortalWrt x86_64 (${{ env.BUILD_DATE }})
          body: |
            自动编译的 ImmortalWrt x86_64 固件。
            构建时间: ${{ env.BUILD_TIME }}
            包含插件: OpenClash, PassWall2, Lucky, Argon, Diskman, KMS 等。
            针对 ESXi 环境优化 (open-vm-tools)。
          files: ./immortalwrt/artifact/firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
