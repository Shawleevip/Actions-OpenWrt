name: ImmortalWrt x86

on:
  schedule:
    - cron: "0 2,10 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
    name: ImmortalWrt 编译
    timeout-minutes: 300

    steps:
      - name: 优化空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 检查代码
        uses: actions/checkout@v4

      - name: 安装依赖
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai
        run: |
          set -e
          sudo -E apt-get update
          sudo -E apt-get install -y \
            ack asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gettext git gperf help2man \
            intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool llvm make \
            ninja-build patch pkgconf python3 python3-pyelftools \
            python3-setuptools rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev scdoc
          sudo -E timedatectl set-timezone Asia/Shanghai

      - name: 克隆 ImmortalWrt
        env:
          REPO_URL: https://github.com/immortalwrt/immortalwrt
          REPO_BRANCH: openwrt-25.12
        run: |
          set -e
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='commit: %H%nsubject: %s'

      - name: 配置 feeds
        working-directory: ./openwrt
        run: |
          set -e
          sed -i '1i src-git rtp2httpd https://github.com/stackia/rtp2httpd.git' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 安装第三方软件包
        working-directory: ./openwrt
        run: |
          set -e

          rm -rf package/feeds/luci/luci-app-openclash package/openclash package/feeds/luci/openclash
          git clone --depth 1 https://github.com/vernesong/OpenClash.git package/openclash

          rm -rf package/feeds/luci/luci-app-passwall2 package/passwall2
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/passwall2

          rm -rf package/dae package/feeds/base/dae
          git clone --depth 1 https://github.com/QiuSimons/luci-app-daed.git package/dae

          rm -rf package/feeds/lucky/luci-app-lucky package/lucky
          git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git package/lucky

          rm -rf package/luci-app-timecontrol /tmp/luci-app-timecontrol
          git clone --depth 1 --branch js \
            https://github.com/gaobin89/luci-app-timecontrol.git \
            /tmp/luci-app-timecontrol
          mkdir -p package/luci-app-timecontrol
          cp -a /tmp/luci-app-timecontrol/luci-app-timecontrol/. package/luci-app-timecontrol/
          rm -rf /tmp/luci-app-timecontrol

          mkdir -p package/luci-app-timecontrol/root/usr/share/luci/menu.d
          cat > package/luci-app-timecontrol/root/usr/share/luci/menu.d/luci-app-timecontrol.json <<'EOF'
          {
              "admin/services/timecontrol": {
                  "title": "Internet Time Control",
                  "order": 90,
                  "action": {
                      "type": "view",
                      "path": "timecontrol/rules"
                  },
                  "depends": {
                      "acl": ["luci-app-timecontrol"],
                      "uci": {"timecontrol": true}
                  }
              }
          }
          EOF

      - name: 验证第三方软件包
        working-directory: ./openwrt
        run: |
          set -e
          for file in \
            package/openclash/luci-app-openclash/Makefile \
            package/passwall2/luci-app-passwall2/Makefile \
            package/dae/luci-app-daed/Makefile \
            package/lucky/luci-app-lucky/Makefile \
            package/luci-app-timecontrol/Makefile
          do
            test -f "$file" || { echo "ERROR: $file"; exit 1; }
          done

          MENU=package/luci-app-timecontrol/root/usr/share/luci/menu.d/luci-app-timecontrol.json
          test -f "$MENU"
          grep -q '"admin/services/timecontrol"' "$MENU"

          TIMECONTROL_VERSION=$(grep '^PKG_VERSION:=' package/luci-app-timecontrol/Makefile | cut -d= -f2)
          TIMECONTROL_RELEASE=$(grep '^PKG_RELEASE:=' package/luci-app-timecontrol/Makefile | cut -d= -f2)
          echo "TIMECONTROL_VERSION=$TIMECONTROL_VERSION" >> "$GITHUB_ENV"
          echo "TIMECONTROL_RELEASE=$TIMECONTROL_RELEASE" >> "$GITHUB_ENV"
          echo "TimeControl: ${TIMECONTROL_VERSION:-unknown}-${TIMECONTROL_RELEASE:-unknown}"

      - name: 自定义配置
        working-directory: ./openwrt
        run: |
          set -e
          rm -f .config .config.old
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y
          CONFIG_CCACHE=y

          # IPv6
          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y

          # 网络接口
          CONFIG_PACKAGE_kmod-bonding=y
          CONFIG_PACKAGE_proto-bonding=y
          CONFIG_PACKAGE_luci-proto-bonding=y

          # LuCI / 管理
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_luci-app-package-manager=y

          # SQM / CAKE
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y

          # RTP2HTTPD
          CONFIG_PACKAGE_luci-app-rtp2httpd=y

          # OpenClash / PassWall2
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-openclash=y

          # DAED / BPF / XDP
          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_BPF_EVENTS=y
          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_KERNEL_XDP_SOCKETS=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y

          # OpenVPN
          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y
          CONFIG_PACKAGE_openvpn-openssl=y

          # WireGuard
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          # Lucky
          CONFIG_PACKAGE_luci-app-lucky=y

          # Argon
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          # UPnP
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          # Vlmcsd / KMS
          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y

          # TimeControl
          CONFIG_PACKAGE_luci-app-timecontrol=y
          CONFIG_PACKAGE_conntrack=y

          # 常用工具
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_SOCAT_SSL=y

          # DNS / Proxy
          CONFIG_SING_BOX_WITH_ECH=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y

          # VMware
          CONFIG_PACKAGE_open-vm-tools=y

          # 网络诊断
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_tcping=y

          # Firewall
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_geoview=y
          EOF

          cp .config .config.requested

      - name: 配置 ccache
        working-directory: ./openwrt
        run: |
          mkdir -p .ccache
          export CCACHE_DIR="$PWD/.ccache"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

      - name: 运行 make defconfig
        working-directory: ./openwrt
        run: |
          set -o pipefail
          make defconfig 2>&1 | tee defconfig.log

      - name: 恢复DL缓存
        uses: actions/cache/restore@v4
        id: cache-dl
        with:
          path: ./openwrt/dl
          key: ${{ runner.os }}-immortalwrt-dl-v7-25.12
          restore-keys: |
            ${{ runner.os }}-immortalwrt-dl-v7-25.12
            ${{ runner.os }}-immortalwrt-dl-

      - name: 恢复 ccache
        uses: actions/cache/restore@v4
        id: cache-ccache
        with:
          path: ./openwrt/.ccache
          key: ${{ runner.os }}-immortalwrt-ccache-v7-25.12
          restore-keys: |
            ${{ runner.os }}-immortalwrt-ccache-v7-25.12
            ${{ runner.os }}-immortalwrt-ccache-

      - name: 恢复工具链缓存
        uses: actions/cache/restore@v4
        id: cache-staging
        with:
          path: |
            ./openwrt/staging_dir/host
            ./openwrt/staging_dir/toolchain-*
          key: ${{ runner.os }}-immortalwrt-staging-v7-25.12-${{ env.SOURCE_COMMIT }}-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-staging-v7-25.12-
            ${{ runner.os }}-immortalwrt-staging-

      - name: 验证配置
        working-directory: ./openwrt
        run: |
          set -e
          FAILED=0

          check_y() {
            local value
            value=$(grep "^$1=" .config 2>/dev/null | cut -d= -f2 || true)
            echo "$1=${value:-<NOT SET>}"
            [ "$value" = "y" ] || FAILED=1
          }

          for P in \
            luci luci-app-openclash luci-app-passwall2 \
            daed luci-app-daed luci-app-lucky luci-app-rtp2httpd \
            luci-app-upnp miniupnpd-nftables luci-app-sqm sqm-scripts \
            kmod-sched-cake kmod-ifb tc-full sing-box chinadns-ng \
            open-vm-tools luci-app-openvpn openvpn-easy-rsa openvpn-openssl \
            kmod-wireguard wireguard-tools luci-proto-wireguard \
            luci-app-timecontrol conntrack
          do
            check_y "CONFIG_PACKAGE_$P"
          done

          for P in odhcp6c odhcpd-ipv6only luci-proto-ipv6; do
            check_y "CONFIG_PACKAGE_$P"
          done

          for P in KERNEL_CGROUPS KERNEL_CGROUP_BPF KERNEL_BPF_EVENTS KERNEL_XDP_SOCKETS; do
            check_y "CONFIG_$P"
          done

          test -f package/luci-app-timecontrol/Makefile
          test -f package/luci-app-timecontrol/root/usr/share/luci/menu.d/luci-app-timecontrol.json
          grep -q '"admin/services/timecontrol"' \
            package/luci-app-timecontrol/root/usr/share/luci/menu.d/luci-app-timecontrol.json

          [ "$FAILED" -eq 0 ]

      - name: 审计环境
        working-directory: ./openwrt
        run: |
          echo "ImmortalWrt: $(git rev-parse HEAD)"
          echo "TimeControl: ${TIMECONTROL_VERSION:-unknown}-${TIMECONTROL_RELEASE:-unknown}"
          echo "CCACHE:"
          ccache -s || true
          echo "DISK:"
          df -h .
          echo "DEFCONFIG WARNINGS:"
          grep -n -Ei \
            'error:|failed|not found|unknown symbol|cannot find|unmet|conflict|not overriding core package' \
            defconfig.log || true

      - name: 编译 ImmortalWrt
        working-directory: ./openwrt
        env:
          TZ: Asia/Shanghai
          CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
        run: |
          set -o pipefail
          export FORCE_UNSAFE_CONFIGURE=1
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          echo "============================================================"
          echo "下载依赖源码包"
          echo "============================================================"
          DOWNLOAD_OK=0
          for i in 1 2 3; do
            if make -j"$(nproc)" download; then
              DOWNLOAD_OK=1
              break
            fi
            echo "下载失败，第 $i 次重试，等待 10 秒..."
            sleep 10
          done
          if [ "$DOWNLOAD_OK" -ne 1 ]; then
            echo "ERROR: 下载依赖重试 3 次后仍失败"
            exit 1
          find dl -type f \( \
            -name '*.tmp' -o -name '*.part' -o -name '*.partial' \
          \) -print -delete || true
          echo "============================================================"
          echo "开始编译 IMMORTALWRT"
          echo "============================================================"
          if ! make -j"$(nproc)" world 2>&1 | tee build.log; then
            tail -n 300 build.log
            exit 1
          fi

          ccache -s || true
          df -h .

      - name: 保存DL缓存
        if: success() && steps.cache-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ./openwrt/dl
          key: ${{ runner.os }}-immortalwrt-dl-v7-25.12

      - name: 保存 ccache
        if: success() && steps.cache-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ./openwrt/.ccache
          key: ${{ runner.os }}-immortalwrt-ccache-v7-25.12

      - name: 保存工具链缓存
        if: success() && steps.cache-staging.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ./openwrt/staging_dir/host
            ./openwrt/staging_dir/toolchain-*
          key: ${{ runner.os }}-immortalwrt-staging-v7-25.12-${{ env.SOURCE_COMMIT }}-${{ hashFiles('openwrt/.config') }}

      - name: 发布固件
        working-directory: ./openwrt
        run: |
          set -e
          mkdir -p release
          DATE=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)
          SRC=$(find bin/targets/x86/64 -maxdepth 1 -type f \
            -name '*combined-efi.img.gz' | head -n 1)

          [ -n "$SRC" ] || {
            find bin/targets/x86/64 -maxdepth 1 -type f -print
            exit 1
          }

          FILE="ImmortalWrt-x86-64-EFI-${DATE}.img.gz"
          cp "$SRC" "release/$FILE"
          sha256sum "release/$FILE" > release/SHA256SUMS.txt

          cat > release/buildinfo.txt <<EOF
          ImmortalWrt branch: openwrt-25.12
          ImmortalWrt commit: ${SOURCE_COMMIT}
          Target: x86_64 Generic
          Firmware: EFI
          Kernel: 6.12.x
          Build time: ${DATE} Asia/Shanghai
          Firmware file: ${FILE}
          EOF

          echo "RELEASE_TAG=ImmortalWrt-25.12-x86_64-${DATE}" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=$FILE" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$DATE" >> "$GITHUB_ENV"
          ls -lh release/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-x86-64-${{ github.run_number }}
          path: |
            ./openwrt/release/*.img.gz
            ./openwrt/release/SHA256SUMS.txt
            ./openwrt/release/buildinfo.txt
          if-no-files-found: error
          retention-days: 14

      - name: 上传诊断信息
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-diagnostics-${{ github.run_number }}
          path: |
            ./openwrt/.config
            ./openwrt/.config.requested
            ./openwrt/defconfig.log
            ./openwrt/build.log
            ./openwrt/release/buildinfo.txt
          if-no-files-found: warn
          retention-days: 14

      - name: 发布Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ImmortalWrt 25.12 x86_64 (${{ env.BUILD_DATE }})
          body: |
            ## ImmortalWrt 25.12 x86_64

            **固件：** `${{ env.RELEASE_FILE }}`
            **目标：** x86_64 Generic
            **格式：** EFI
            **编译时间：** ${{ env.BUILD_DATE }} 北京时间

            ### 主要组件
            OpenClash / PassWall2 / DAED / Lucky / RTP2HTTPD
            SQM / CAKE / WireGuard / OpenVPN
            TimeControl / UPnP / Vlmcsd / Argon

            ### 源码
            ImmortalWrt branch: openwrt-25.12
            ImmortalWrt commit: ${{ env.SOURCE_COMMIT }}

          files: |
            ./openwrt/release/${{ env.RELEASE_FILE }}
            ./openwrt/release/SHA256SUMS.txt
            ./openwrt/release/buildinfo.txt
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KEEP=30
          gh release list \
            --repo "${{ github.repository }}" \
            --limit 500 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            > all_tags.txt

          TOTAL=$(wc -l < all_tags.txt)
          if [ "$TOTAL" -gt "$KEEP" ]; then
            tail -n +"$((KEEP + 1))" all_tags.txt |
            while read -r TAG; do
              [ -z "$TAG" ] && continue
              gh release delete "$TAG" \
                --repo "${{ github.repository }}" \
                --yes \
                --cleanup-tag
            done
          fi

      - name: 最终总结
        if: always()
        working-directory: ./openwrt
        run: |
          echo "ImmortalWrt commit: ${SOURCE_COMMIT:-unknown}"
          echo "Release: ${RELEASE_TAG:-not-created}"
          echo "Image: ${RELEASE_FILE:-not-created}"
          echo "TimeControl: ${TIMECONTROL_VERSION:-unknown}-${TIMECONTROL_RELEASE:-unknown}"
          ccache -s || true
          df -h . || true
