name: OpenWrt 25.12 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_BRANCH: openwrt-25.12
  OPENWRT_DIR: openwrt
  TZ: Asia/Shanghai

jobs:
  build:
    name: OpenWrt 25.12 x86_64
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Maximize build space
      # ==========================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ==========================================================
      # 3. Build dependencies
      # ==========================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive

        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc \
            zstd

          sudo timedatectl set-timezone Asia/Shanghai


      # ==========================================================
      # 4. Build information
      # ==========================================================

      - name: Set build information
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"


      # ==========================================================
      # 5. CCache
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-25.12-x86_64-${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}
          restore-keys: |
            openwrt-25.12-x86_64-${{ runner.os }}-ccache-


      # ==========================================================
      # 6. Clone official OpenWrt
      # ==========================================================

      - name: Clone official OpenWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$OPENWRT_BRANCH" \
            https://github.com/openwrt/openwrt.git \
            "$OPENWRT_DIR"

          cd "$OPENWRT_DIR"

          echo "========================================"
          echo "OpenWrt source"
          echo "========================================"

          git log -1 --oneline
          git describe --always --dirty


      # ==========================================================
      # 7. Download cache
      # ==========================================================

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12-x86_64-${{ runner.os }}-dl-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}
          restore-keys: |
            openwrt-25.12-x86_64-${{ runner.os }}-dl-


      # ==========================================================
      # 8. Add third-party feeds
      #
      # These feeds are used ONLY during compilation.
      # They will be removed from feeds.conf.default after
      # packages have been installed into package/feeds/.
      # ==========================================================

      - name: Configure third-party feeds
        working-directory: ./openwrt
        run: |
          cat >> feeds.conf.default <<'EOF'

          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          src-git sbwml https://github.com/sbwml/openwrt_pkgs.git;main

          EOF


      # ==========================================================
      # 9. Update feeds
      # ==========================================================

      - name: Update feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ==========================================================
      # 10. Freeze third-party feed configuration
      #
      # The feed packages have already been installed into
      # package/feeds/.
      #
      # Removing the custom feed definitions here prevents their
      # URLs from becoming runtime APK repositories.
      # ==========================================================

      - name: Freeze third-party feeds
        working-directory: ./openwrt
        run: |
          sed -i \
            -e '/^src-git passwall /d' \
            -e '/^src-git passwall_packages /d' \
            -e '/^src-git passwall2 /d' \
            -e '/^src-git sbwml /d' \
            feeds.conf.default

          echo "========================================"
          echo "Final feeds.conf.default"
          echo "========================================"

          cat feeds.conf.default


      # ==========================================================
      # 11. Add OpenClash
      #
      # OpenClash repository contains the actual package under:
      # luci-app-openclash/
      #
      # Copy only the real package directory.
      # ==========================================================

      - name: Add OpenClash
        working-directory: ./openwrt
        run: |
          rm -rf /tmp/openclash
          rm -rf package/luci-app-openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/openclash

          cp -a \
            /tmp/openclash/luci-app-openclash \
            package/luci-app-openclash

          test -f package/luci-app-openclash/Makefile

          echo "OpenClash installed."


      # ==========================================================
      # 12. Add Lucky
      # ==========================================================

      - name: Add Lucky
        working-directory: ./openwrt
        run: |
          rm -rf package/lucky

          git clone \
            --depth 1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky

          test -d package/lucky/lucky
          test -d package/lucky/luci-app-lucky

          echo "Lucky installed."


      # ==========================================================
      # 13. Add Argon
      # ==========================================================

      - name: Add Argon
        working-directory: ./openwrt
        run: |
          rm -rf \
            package/luci-theme-argon \
            package/luci-app-argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config

          test -f package/luci-theme-argon/Makefile
          test -f package/luci-app-argon-config/Makefile

          echo "Argon installed."


      # ==========================================================
      # 14. Add Diskman
      # ==========================================================

      - name: Add Diskman
        working-directory: ./openwrt
        run: |
          rm -rf package/diskman

          git clone \
            --depth 1 \
            https://github.com/lisaac/luci-app-diskman.git \
            package/diskman

          echo "Diskman installed."


      # ==========================================================
      # 15. Prepare package symlinks
      # ==========================================================

      - name: Prepare package symlinks
        working-directory: ./openwrt
        run: |
          make package/symlinks


      # ==========================================================
      # 16. Generate configuration
      #
      # IMPORTANT:
      #
      # There are NO custom files/etc/uci-defaults scripts here.
      #
      # The previous rc.common problem appeared only after we
      # introduced custom first-boot scripts. This version keeps
      # the successful build structure free of such scripts.
      # ==========================================================

      - name: Generate configuration
        working-directory: ./openwrt
        run: |

          rm -f .config

          cat > .config <<'EOF'

          # ======================================================
          # Target
          # ======================================================

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y


          # ======================================================
          # Firmware
          #
          # EFI only.
          #
          # VMDK is deliberately NOT enabled anymore.
          # ======================================================

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640

          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y


          # ======================================================
          # LuCI
          # ======================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-package-manager=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


          # ======================================================
          # IPv6
          # ======================================================

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y


          # ======================================================
          # Filesystems
          # ======================================================

          CONFIG_PACKAGE_kmod-fs-nfs=y
          CONFIG_PACKAGE_kmod-fs-nfs-common=y
          CONFIG_PACKAGE_kmod-fs-nfs-v3=y
          CONFIG_PACKAGE_kmod-fs-nfs-v4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y


          # ======================================================
          # USB
          # ======================================================

          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ohci-pci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb2-pci=y
          CONFIG_PACKAGE_kmod-usb3=y


          # ======================================================
          # Bonding
          # ======================================================

          CONFIG_PACKAGE_kmod-bonding=y


          # ======================================================
          # SQM / CAKE
          # ======================================================

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y


          # ======================================================
          # OpenVPN
          # ======================================================

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y


          # ======================================================
          # WireGuard
          # ======================================================

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y


          # ======================================================
          # OpenClash
          # ======================================================

          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_unzip=y

          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y


          # ======================================================
          # PassWall2
          # ======================================================

          CONFIG_PACKAGE_luci-app-passwall2=y

          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y

          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y


          # ======================================================
          # Lucky
          # ======================================================

          CONFIG_PACKAGE_luci-app-lucky=y


          # ======================================================
          # RTP2HTTPD
          #
          # Provided by sbwml feed.
          # ======================================================

          CONFIG_PACKAGE_rtp2httpd=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y


          # ======================================================
          # Vlmcsd / KMS
          #
          # Provided by sbwml feed when available.
          # ======================================================

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          # ======================================================
          # Argon
          # ======================================================

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y


          # ======================================================
          # Diskman
          # ======================================================

          CONFIG_PACKAGE_luci-app-diskman=y


          # ======================================================
          # UPnP / IGD / NAT-PMP / PCP
          # ======================================================

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y


          # ======================================================
          # IRQBalance
          # ======================================================

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y


          # ======================================================
          # TTYD
          # ======================================================

          CONFIG_PACKAGE_luci-app-ttyd=y


          # ======================================================
          # Network / diagnostic tools
          #
          # IMPORTANT:
          #
          # Do NOT select wget / wget-ssl here.
          #
          # OpenWrt 25.12 has a confirmed wget-nossl/wget
          # alternative issue which can break apk update.
          # ======================================================

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y

          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y

          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y

          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y


          # ======================================================
          # ESXi
          # ======================================================

          CONFIG_PACKAGE_open-vm-tools=y


          # ======================================================
          # Firewall
          # ======================================================

          CONFIG_PACKAGE_firewall4=y


          # ======================================================
          # CCache
          # ======================================================

          CONFIG_CCACHE=y

          EOF


          # ======================================================
          # Optional Chinese localization packages
          #
          # Add only packages that actually exist in the current
          # source tree.
          #
          # OpenClash itself provides its translations and does
          # not need a separate forced luci-i18n package here.
          # ======================================================

          has_package() {
            PKG="$1"

            grep -Rqs \
              --include='Makefile' \
              "^Package/${PKG}" \
              package \
              feeds \
              2>/dev/null
          }

          for PKG in \
            luci-i18n-package-manager-zh-cn \
            luci-i18n-firewall-zh-cn \
            luci-i18n-openvpn-zh-cn \
            luci-i18n-wireguard-zh-cn \
            luci-i18n-sqm-zh-cn \
            luci-i18n-upnp-zh-cn \
            luci-i18n-irqbalance-zh-cn \
            luci-i18n-ttyd-zh-cn \
            luci-i18n-passwall2-zh-cn \
            luci-i18n-lucky-zh-cn \
            luci-i18n-rtp2httpd-zh-cn \
            luci-i18n-vlmcsd-zh-cn \
            luci-i18n-argon-config-zh-cn \
            luci-i18n-diskman-zh-cn
          do
            if has_package "$PKG"; then
              echo "CONFIG_PACKAGE_${PKG}=y" >> .config
              echo "[ OK ] ${PKG}"
            else
              echo "[SKIP] ${PKG}"
            fi
          done


          # ======================================================
          # Resolve dependencies
          # ======================================================

          make defconfig


          echo ""
          echo "========================================"
          echo "Important selected packages"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|luci-i18n-passwall2-zh-cn|luci-app-lucky|luci-i18n-lucky-zh-cn|luci-app-rtp2httpd|luci-i18n-rtp2httpd-zh-cn|rtp2httpd|vlmcsd|luci-app-vlmcsd|luci-i18n-vlmcsd-zh-cn|luci-app-sqm|luci-i18n-sqm-zh-cn|luci-app-openvpn|luci-i18n-openvpn-zh-cn|wireguard-tools|luci-i18n-wireguard-zh-cn|luci-theme-argon|luci-app-argon-config|luci-i18n-argon-config-zh-cn|luci-app-diskman|miniupnpd-nftables|luci-app-upnp|luci-i18n-upnp-zh-cn|luci-i18n-base-zh-cn|wget)' \
            .config \
            || true

          echo ""
          echo "========================================"
          echo "Image configuration"
          echo "========================================"

          grep -E \
            '^CONFIG_(TARGET_x86|TARGET_KERNEL_PARTSIZE|TARGET_ROOTFS_PARTSIZE|TARGET_IMAGES_GZIP|EFI_IMAGES|VMDK_IMAGES)' \
            .config \
            || true


      # ==========================================================
      # 17. Validate critical configuration
      #
      # VMDK intentionally NOT checked.
      # ==========================================================

      - name: Validate configuration
        working-directory: ./openwrt
        run: |
          set -e

          REQUIRED="
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_EFI_IMAGES=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_wireguard-tools=y

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-diskman=y

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          "

          echo "========================================"
          echo "Validating configuration"
          echo "========================================"

          for item in $REQUIRED; do
            if grep -qx "$item" .config; then
              echo "[ OK ] $item"
            else
              echo "[FAIL] $item"
              exit 1
            fi
          done

          echo ""
          echo "Configuration verified."


      # ==========================================================
      # 18. Check prerequisites
      # ==========================================================

      - name: Check prerequisites
        working-directory: ./openwrt
        run: |
          make prereq


      # ==========================================================
      # 19. Download sources
      # ==========================================================

      - name: Download sources
        working-directory: ./openwrt
        run: |
          make download -j8 V=s


      # ==========================================================
      # 20. Compile firmware
      # ==========================================================

      - name: Compile firmware
        working-directory: ./openwrt
        run: |
          echo "========================================"
          echo "OpenWrt 25.12 build started"
          echo "$BUILD_TIME"
          echo "========================================"

          make -j$(nproc) || \
          make -j1 V=s

          echo "========================================"
          echo "OpenWrt 25.12 build finished"
          echo "========================================"

          date


      # ==========================================================
      # 21. Verify EFI firmware
      #
      # EFI is the only firmware image intentionally produced.
      # ==========================================================

      - name: Verify firmware
        working-directory: ./openwrt
        run: |
          set -e

          TARGET="bin/targets/x86/64"

          echo "========================================"
          echo "Generated files"
          echo "========================================"

          find "$TARGET" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


          EFI="$(find "$TARGET" \
            -maxdepth 1 \
            -type f \
            -name '*generic-squashfs-combined-efi.img.gz' \
            | head -n 1)"


          if [ -z "$EFI" ]; then
            echo ""
            echo "ERROR: EFI image not found."
            echo ""

            find "$TARGET" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n'

            exit 1
          fi


          echo ""
          echo "EFI image:"
          echo "$EFI"
          echo ""
          ls -lh "$EFI"


      # ==========================================================
      # 22. Prepare artifacts
      # ==========================================================

      - name: Prepare artifacts
        working-directory: ./openwrt
        run: |
          set -e

          TARGET="bin/targets/x86/64"

          rm -rf artifact

          mkdir -p \
            artifact/firmware \
            artifact/buildinfo


          # ------------------------------------------------------
          # EFI
          # ------------------------------------------------------

          EFI="$(find "$TARGET" \
            -maxdepth 1 \
            -type f \
            -name '*generic-squashfs-combined-efi.img.gz' \
            | head -n 1)"

          test -n "$EFI"


          cp "$EFI" \
            "artifact/firmware/OpenWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img.gz"


          # ------------------------------------------------------
          # SHA256
          # ------------------------------------------------------

          cd artifact/firmware

          sha256sum * > SHA256SUMS

          cd ../..


          # ------------------------------------------------------
          # Build information
          # ------------------------------------------------------

          cp .config \
            artifact/buildinfo/config.final

          git log -1 --format=fuller \
            > artifact/buildinfo/source.commit

          git describe --always --dirty \
            > artifact/buildinfo/source.version


          find "$TARGET" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.buildinfo' \
              -o \
              -name '*.manifest' \
              -o \
              -name '*.bom.cdx.json' \
            \) \
            -exec cp {} artifact/buildinfo/ \;


          echo ""
          echo "========================================"
          echo "Firmware"
          echo "========================================"

          ls -lh artifact/firmware


          echo ""
          echo "========================================"
          echo "BuildInfo"
          echo "========================================"

          ls -lh artifact/buildinfo


      # ==========================================================
      # 23. Upload firmware
      # ==========================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12-x86-64-Firmware-${{ env.BUILD_DATE }}
          path: ./openwrt/artifact/firmware/*
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 24. Upload BuildInfo
      # ==========================================================

      - name: Upload BuildInfo
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12-x86-64-BuildInfo-${{ env.BUILD_DATE }}
          path: ./openwrt/artifact/buildinfo/*
          if-no-files-found: error
          retention-days: 30
