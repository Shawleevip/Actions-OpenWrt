name: OpenWrt 25.12 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_BRANCH: openwrt-25.12
  OPENWRT_DIR: openwrt
  TZ: Asia/Shanghai

jobs:

  build:
    name: OpenWrt 25.12 x86_64
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout build repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Maximize disk space
      # ============================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192

          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ============================================================
      # 3. Install build dependencies
      # ============================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive

        run: |

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc \
            zstd

          sudo timedatectl set-timezone Asia/Shanghai


      # ============================================================
      # 4. Build timestamp
      # ============================================================

      - name: Set build information
        run: |

          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"


      # ============================================================
      # 5. Restore ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache

          key: openwrt-25.12-x86_64-${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}

          restore-keys: |
            openwrt-25.12-x86_64-${{ runner.os }}-ccache-


      # ============================================================
      # 6. Clone official OpenWrt 25.12
      # ============================================================

      - name: Clone official OpenWrt
        run: |

          git clone \
            --depth 1 \
            --branch "$OPENWRT_BRANCH" \
            https://github.com/openwrt/openwrt.git \
            "$OPENWRT_DIR"

          cd "$OPENWRT_DIR"

          echo "========================================"
          echo "OpenWrt source"
          echo "========================================"

          git log -1 --oneline
          git describe --always --dirty

          echo "========================================"


      # ============================================================
      # 7. Restore download cache
      # ============================================================

      - name: Restore OpenWrt download cache
        uses: actions/cache@v4

        with:
          path: |
            openwrt/dl

          key: openwrt-25.12-x86_64-dl-${{ runner.os }}-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}

          restore-keys: |
            openwrt-25.12-x86_64-dl-${{ runner.os }}-


      # ============================================================
      # 8. Official feeds ONLY
      # ============================================================

      - name: Update official feeds
        working-directory: ./openwrt

        run: |

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ============================================================
      # 9. OpenClash
      # ============================================================

      - name: Add OpenClash
        working-directory: ./openwrt

        run: |

          rm -rf package/luci-app-openclash

          mkdir -p package/luci-app-openclash

          cd package/luci-app-openclash

          git init

          git remote add origin \
            https://github.com/vernesong/OpenClash.git

          git config core.sparseCheckout true

          echo "luci-app-openclash" \
            > .git/info/sparse-checkout

          git pull \
            --depth 1 \
            origin master

          cd ../..

          echo "OpenClash installed."


      # ============================================================
      # 10. PassWall2
      #
      # 只引入 PassWall2 LuCI。
      # 暂不让 PassWall 接管官方 proxy core。
      # ============================================================

      - name: Add PassWall2
        working-directory: ./openwrt

        run: |

          rm -rf package/passwall2

          git clone \
            --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
            package/passwall2

          echo "PassWall2 installed."


      # ============================================================
      # 11. Lucky
      # ============================================================

      - name: Add Lucky
        working-directory: ./openwrt

        run: |

          git clone \
            --depth 1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky


      # ============================================================
      # 12. RTP2HTTPD
      # ============================================================

      - name: Add RTP2HTTPD
        working-directory: ./openwrt

        run: |

          git clone \
            --depth 1 \
            https://github.com/stackia/rtp2httpd.git \
            package/rtp2httpd


      # ============================================================
      # 13. Vlmcsd / KMS
      # ============================================================

      - name: Add Vlmcsd
        working-directory: ./openwrt

        run: |

          rm -rf package/vlmcsd

          git clone \
            --filter=blob:none \
            --no-checkout \
            --depth 1 \
            https://github.com/sbwml/openwrt_pkgs.git \
            package/vlmcsd

          cd package/vlmcsd

          git sparse-checkout init --cone

          git sparse-checkout set \
            vlmcsd \
            luci-app-vlmcsd

          git checkout

          cd ../..

          echo "Vlmcsd installed."


      # ============================================================
      # 14. Argon
      # ============================================================

      - name: Add Argon
        working-directory: ./openwrt

        run: |

          rm -rf \
            package/luci-theme-argon \
            package/luci-app-argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config


      # ============================================================
      # 16. Diskman
      # ============================================================

      - name: Add Diskman
        working-directory: ./openwrt

        run: |

          git clone \
            --depth 1 \
            https://github.com/lisaac/luci-app-diskman.git \
            package/diskman


      # ============================================================
      # 17. Prepare package symlinks
      # ============================================================

      - name: Prepare packages
        working-directory: ./openwrt

        run: |

          make package/symlinks


      # ============================================================
      # 18. Generate .config
      # ============================================================

      - name: Generate configuration
        working-directory: ./openwrt

        run: |

          rm -f .config

          cat > .config <<'EOF'

          # ========================================================
          # Target
          # ========================================================

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y


          # ========================================================
          # Kernel / RootFS
          # ========================================================

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640


          # ========================================================
          # Firmware
          # ========================================================

          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y


          # ========================================================
          # LuCI
          # ========================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y


          # ========================================================
          # IPv6
          # ========================================================

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y


          # ========================================================
          # Filesystem
          # ========================================================

          CONFIG_PACKAGE_kmod-fs-nfs=y
          CONFIG_PACKAGE_kmod-fs-nfs-common=y
          CONFIG_PACKAGE_kmod-fs-nfs-v3=y
          CONFIG_PACKAGE_kmod-fs-nfs-v4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y


          # ========================================================
          # USB
          # ========================================================

          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ohci-pci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb2-pci=y
          CONFIG_PACKAGE_kmod-usb3=y


          # ========================================================
          # Bonding
          # ========================================================

          CONFIG_PACKAGE_kmod-bonding=y


          # ========================================================
          # SQM / CAKE
          # ========================================================

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y


          # ========================================================
          # OpenVPN
          # ========================================================

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y


          # ========================================================
          # WireGuard
          # ========================================================

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y


          # ========================================================
          # OpenClash
          # ========================================================

          CONFIG_PACKAGE_luci-app-openclash=y


          # ========================================================
          # PassWall2
          # ========================================================

          CONFIG_PACKAGE_luci-app-passwall2=y


          # ========================================================
          # Sing-box
          # ========================================================

          CONFIG_PACKAGE_sing-box=y


          # ========================================================
          # Lucky
          # ========================================================

          CONFIG_PACKAGE_luci-app-lucky=y


          # ========================================================
          # RTP2HTTPD
          # ========================================================

          CONFIG_PACKAGE_luci-app-rtp2httpd=y


          # ========================================================
          # Vlmcsd / KMS
          # ========================================================

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          # ========================================================
          # Argon
          # ========================================================

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y


          # ========================================================
          # DDNS-Go
          # ========================================================

          CONFIG_PACKAGE_luci-app-ddns-go=y


          # ========================================================
          # Diskman
          # ========================================================

          CONFIG_PACKAGE_luci-app-diskman=y


          # ========================================================
          # Tools
          # ========================================================

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_luci-app-ttyd=y


          # ========================================================
          # Firewall
          # ========================================================

          CONFIG_PACKAGE_firewall4=y


          # ========================================================
          # CCache
          # ========================================================

          CONFIG_CCACHE=y

          EOF


          # ========================================================
          # Resolve dependencies
          # ========================================================

          make defconfig


          echo "========================================"
          echo "Final selected packages"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|luci-app-lucky|luci-app-rtp2httpd|vlmcsd|luci-app-vlmcsd|luci-app-sqm|openvpn-openssl|wireguard-tools|luci-theme-argon|sing-box)' \
            .config \
            || true


      # ============================================================
      # 19. Build prerequisites
      # ============================================================

      - name: Check prerequisites
        working-directory: ./openwrt

        run: |

          make prereq


      # ============================================================
      # 20. Download sources
      # ============================================================

      - name: Download sources
        working-directory: ./openwrt

        run: |

          make download -j8 V=s


      # ============================================================
      # 21. Compile
      # ============================================================

      - name: Compile firmware
        working-directory: ./openwrt

        run: |

          echo "========================================"
          echo "Build started"
          echo "$BUILD_TIME"
          echo "========================================"

          make -j$(nproc) || \
          make -j1 V=s

          echo "========================================"
          echo "Build finished"
          date
          echo "========================================"


      # ============================================================
      # 22. Verify firmware
      # ============================================================

      - name: Verify firmware
        working-directory: ./openwrt

        run: |

          TARGET_DIR="bin/targets/x86/64"

          echo "========================================"
          echo "All generated images"
          echo "========================================"

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


          EFI_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*generic-squashfs-combined-efi.img.gz' \
            | head -n 1)"


          if [ -z "$EFI_IMAGE" ]; then

            echo ""
            echo "ERROR: SquashFS EFI image not found!"
            echo ""

            find "$TARGET_DIR" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n'

            exit 1

          fi


          echo ""
          echo "EFI image found:"
          echo "$EFI_IMAGE"


      # ============================================================
      # 23. Prepare artifacts
      # ============================================================

      - name: Prepare artifacts
        working-directory: ./openwrt

        run: |

          set -e

          TARGET_DIR="bin/targets/x86/64"

          rm -rf artifact

          mkdir -p \
            artifact/firmware \
            artifact/apk \
            artifact/buildinfo


          # ========================================================
          # EFI ONLY
          # ========================================================

          EFI_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*generic-squashfs-combined-efi.img.gz' \
            | head -n 1)"


          cp "$EFI_IMAGE" \
            "artifact/firmware/OpenWrt-25.12-x86-64-SquashFS-UEFI-${BUILD_DATE}.img.gz"


          # ========================================================
          # SHA256
          # ========================================================

          cd artifact/firmware

          sha256sum *.img.gz > SHA256SUMS

          cd ../..


          # ========================================================
          # APK
          # ========================================================

          if [ -d bin/packages ]; then

            find bin/packages \
              -type f \
              -name '*.apk' \
              -exec cp {} artifact/apk/ \;

          fi


          # ========================================================
          # Buildinfo
          # ========================================================

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.buildinfo' \
              -o \
              -name '*.manifest' \
            \) \
            -exec cp {} artifact/buildinfo/ \;


          # ========================================================
          # Summary
          # ========================================================

          echo ""
          echo "========================================"
          echo "Firmware"
          echo "========================================"

          ls -lh artifact/firmware


          echo ""
          echo "========================================"
          echo "APK packages"
          echo "========================================"

          find artifact/apk \
            -type f \
            -name '*.apk' \
            -printf '%f\n' \
            | sort


          echo ""
          echo "========================================"
          echo "Buildinfo"
          echo "========================================"

          ls -lh artifact/buildinfo || true


      # ============================================================
      # 24. Upload EFI
      # ============================================================

      - name: Upload EFI firmware
        uses: actions/upload-artifact@v4

        with:
          name: OpenWrt-25.12-x86-64-UEFI-${{ env.BUILD_DATE }}

          path: |
            ./openwrt/artifact/firmware/*

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # 25. Upload APK
      # ============================================================

      - name: Upload APK packages
        uses: actions/upload-artifact@v4

        with:
          name: OpenWrt-25.12-x86-64-APK-${{ env.BUILD_DATE }}

          path: |
            ./openwrt/artifact/apk/*.apk

          if-no-files-found: warn

          retention-days: 30


      # ============================================================
      # 26. Upload build information
      # ============================================================

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4

        with:
          name: OpenWrt-25.12-x86-64-BuildInfo-${{ env.BUILD_DATE }}

          path: |
            ./openwrt/artifact/buildinfo/*

          if-no-files-found: warn

          retention-days: 30
