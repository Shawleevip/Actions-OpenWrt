name: OpenWrt 25.12 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_BRANCH: openwrt-25.12
  OPENWRT_DIR: openwrt
  TZ: Asia/Shanghai

jobs:
  build:
    name: OpenWrt 25.12 x86_64
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Free disk space
      # ==========================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true


      # ==========================================================
      # 3. Build dependencies
      # ==========================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            ninja-build \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc \
            zstd

          sudo timedatectl set-timezone Asia/Shanghai


      # ==========================================================
      # 4. Build information
      # ==========================================================

      - name: Set build information
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"


      # ==========================================================
      # 5. ccache
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-25.12-x86_64-ccache-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}
          restore-keys: |
            openwrt-25.12-x86_64-ccache-


      # ==========================================================
      # 6. Clone official OpenWrt
      # ==========================================================

      - name: Clone OpenWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$OPENWRT_BRANCH" \
            https://github.com/openwrt/openwrt.git \
            "$OPENWRT_DIR"

          cd "$OPENWRT_DIR"

          echo "========================================"
          echo "OpenWrt source"
          echo "========================================"

          git log -1 --oneline
          git describe --always --dirty


      # ==========================================================
      # 7. Download cache
      # ==========================================================

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12-x86_64-dl-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}
          restore-keys: |
            openwrt-25.12-x86_64-dl-


      # ==========================================================
      # 8. Official feeds
      # ==========================================================

      - name: Update feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ==========================================================
      # 9. Third-party packages
      # ==========================================================

      - name: Add third-party packages
        working-directory: ./openwrt
        run: |

          # OpenClash
          rm -rf package/luci-app-openclash
          git clone --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/openclash

          cp -a \
            /tmp/openclash/luci-app-openclash \
            package/luci-app-openclash


          # PassWall2
          rm -rf package/passwall2
          git clone --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
            package/passwall2


          # Lucky
          rm -rf package/lucky
          git clone --depth 1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky


          # RTP2HTTPD
          rm -rf package/rtp2httpd
          git clone --depth 1 \
            https://github.com/stackia/rtp2httpd.git \
            package/rtp2httpd


          # Argon
          rm -rf \
            package/luci-theme-argon \
            package/luci-app-argon-config

          git clone --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config


          # Diskman
          rm -rf package/diskman
          git clone --depth 1 \
            https://github.com/lisaac/luci-app-diskman.git \
            package/diskman


          # Vlmcsd
          rm -rf package/vlmcsd

          git clone \
            --filter=blob:none \
            --no-checkout \
            --depth 1 \
            https://github.com/sbwml/openwrt_pkgs.git \
            package/vlmcsd

          cd package/vlmcsd

          git sparse-checkout init --cone

          git sparse-checkout set \
            vlmcsd \
            luci-app-vlmcsd

          git checkout

          cd ../..

          make package/symlinks


      # ==========================================================
      # 10. Configuration
      # ==========================================================

      - name: Generate configuration
        working-directory: ./openwrt
        run: |

          cat > .config <<'EOF'

          # ======================================================
          # Target
          # ======================================================

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640


          # ======================================================
          # Images
          # ======================================================

          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y
          CONFIG_VMDK_IMAGES=y


          # ======================================================
          # LuCI
          # ======================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          # Simplified Chinese
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


          # ======================================================
          # IPv6
          # ======================================================

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y


          # ======================================================
          # Filesystems
          # ======================================================

          CONFIG_PACKAGE_kmod-fs-nfs=y
          CONFIG_PACKAGE_kmod-fs-nfs-common=y
          CONFIG_PACKAGE_kmod-fs-nfs-v3=y
          CONFIG_PACKAGE_kmod-fs-nfs-v4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y


          # ======================================================
          # USB
          # ======================================================

          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ohci-pci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb2-pci=y
          CONFIG_PACKAGE_kmod-usb3=y


          # ======================================================
          # Bonding
          # ======================================================

          CONFIG_PACKAGE_kmod-bonding=y


          # ======================================================
          # SQM / CAKE
          # ======================================================

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y


          # ======================================================
          # OpenVPN
          # ======================================================

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y


          # ======================================================
          # WireGuard
          # ======================================================

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y


          # ======================================================
          # OpenClash
          # ======================================================

          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_coreutils-nohup=y


          # ======================================================
          # PassWall2
          # ======================================================

          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y


          # ======================================================
          # Lucky
          # ======================================================

          CONFIG_PACKAGE_luci-app-lucky=y


          # ======================================================
          # RTP2HTTPD
          # ======================================================

          CONFIG_PACKAGE_luci-app-rtp2httpd=y


          # ======================================================
          # Vlmcsd
          # ======================================================

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          # ======================================================
          # Argon
          # ======================================================

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y


          # ======================================================
          # Diskman
          # ======================================================

          CONFIG_PACKAGE_luci-app-diskman=y


          # ======================================================
          # Common tools
          # ======================================================

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y


          # ======================================================
          # ESXi
          # ======================================================

          CONFIG_PACKAGE_open-vm-tools=y


          # ======================================================
          # IRQ Balance
          # ======================================================

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y


          # ======================================================
          # LuCI terminal
          # ======================================================

          CONFIG_PACKAGE_luci-app-ttyd=y


          # ======================================================
          # Firewall
          # ======================================================

          CONFIG_PACKAGE_firewall4=y


          # ======================================================
          # CCache
          # ======================================================

          CONFIG_CCACHE=y

          EOF

          make defconfig


      # ==========================================================
      # 11. Download
      # ==========================================================

      - name: Download sources
        working-directory: ./openwrt
        run: |
          make download -j8


      # ==========================================================
      # 12. Compile
      # ==========================================================

      - name: Compile firmware
        working-directory: ./openwrt
        run: |
          echo "========================================"
          echo "OpenWrt build started"
          echo "$BUILD_TIME"
          echo "========================================"

          make -j$(nproc) || \
          make -j1 V=s

          echo "========================================"
          echo "OpenWrt build finished"
          echo "========================================"

          date


      # ==========================================================
      # 13. Prepare firmware + BuildInfo
      # ==========================================================

      - name: Prepare artifacts
        working-directory: ./openwrt
        run: |

          TARGET="bin/targets/x86/64"

          rm -rf artifact
          mkdir -p \
            artifact/firmware \
            artifact/buildinfo


          # EFI
          EFI="$(find "$TARGET" -maxdepth 1 -type f \
            \( \
              -name '*combined-efi.img.gz' \
              -o \
              -name '*combined-efi.img' \
            \) | head -n 1)"

          test -n "$EFI"

          case "$EFI" in
            *.gz)
              cp "$EFI" \
                "artifact/firmware/OpenWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img.gz"
              ;;
            *)
              cp "$EFI" \
                "artifact/firmware/OpenWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img"
              ;;
          esac


          # VMDK
          VMDK="$(find "$TARGET" \
            -maxdepth 1 \
            -type f \
            -name '*.vmdk' \
            | head -n 1)"

          test -n "$VMDK"

          cp "$VMDK" \
            "artifact/firmware/OpenWrt-25.12-x86-64-ESXi-${BUILD_DATE}.vmdk"


          # SHA256
          cd artifact/firmware
          sha256sum * > SHA256SUMS
          cd ../..


          # BuildInfo
          cp .config \
            artifact/buildinfo/config.final

          git log -1 --format=fuller \
            > artifact/buildinfo/source.commit

          git describe --always --dirty \
            > artifact/buildinfo/source.version

          find "$TARGET" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.buildinfo' \
              -o \
              -name '*.manifest' \
              -o \
              -name '*.bom.cdx.json' \
            \) \
            -exec cp {} artifact/buildinfo/ \;

          echo ""
          echo "========================================"
          echo "Firmware"
          echo "========================================"

          ls -lh artifact/firmware

          echo ""
          echo "========================================"
          echo "BuildInfo"
          echo "========================================"

          ls -lh artifact/buildinfo


      # ==========================================================
      # 14. Upload firmware
      # ==========================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12-x86-64-Firmware-${{ env.BUILD_DATE }}
          path: ./openwrt/artifact/firmware/*
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 15. Upload BuildInfo
      # ==========================================================

      - name: Upload BuildInfo
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12-x86-64-BuildInfo-${{ env.BUILD_DATE }}
          path: ./openwrt/artifact/buildinfo/*
          if-no-files-found: error
          retention-days: 30
