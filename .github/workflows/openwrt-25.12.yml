name: OpenWrt 25.12 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_BRANCH: openwrt-25.12
  OPENWRT_DIR: openwrt
  TZ: Asia/Shanghai

jobs:
  build:
    name: OpenWrt 25.12 x86_64
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Maximize build space
      # ==========================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ==========================================================
      # 3. Build dependencies
      # ==========================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive

        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc \
            zstd

          sudo timedatectl set-timezone Asia/Shanghai


      # ==========================================================
      # 4. Build information
      # ==========================================================

      - name: Set build information
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"


      # ==========================================================
      # 5. CCache
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-25.12-x86_64-${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}
          restore-keys: |
            openwrt-25.12-x86_64-${{ runner.os }}-ccache-


      # ==========================================================
      # 6. Clone official OpenWrt
      # ==========================================================

      - name: Clone official OpenWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$OPENWRT_BRANCH" \
            https://github.com/openwrt/openwrt.git \
            "$OPENWRT_DIR"

          cd "$OPENWRT_DIR"

          echo "OpenWrt source:"
          git log -1 --oneline
          git describe --always --dirty


      # ==========================================================
      # 7. Download cache
      # ==========================================================

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12-x86_64-${{ runner.os }}-dl-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}
          restore-keys: |
            openwrt-25.12-x86_64-${{ runner.os }}-dl-


      # ==========================================================
      # 8. Third-party feeds
      # ==========================================================

      - name: Configure third-party feeds
        working-directory: ./openwrt
        run: |
          cat >> feeds.conf.default <<'EOF'

          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          src-git sbwml https://github.com/sbwml/openwrt_pkgs.git;main

          EOF


      # ==========================================================
      # 9. Update feeds
      # ==========================================================

      - name: Update feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ==========================================================
      # 10. Add third-party packages
      # ==========================================================

      - name: Add third-party packages
        working-directory: ./openwrt
        run: |

          # OpenClash
          rm -rf package/luci-app-openclash
          git clone --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            package/luci-app-openclash

          # Lucky
          rm -rf package/lucky
          git clone --depth 1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky

          # Argon
          rm -rf \
            package/luci-theme-argon \
            package/luci-app-argon-config

          git clone --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config

          # Diskman
          rm -rf package/diskman
          git clone --depth 1 \
            https://github.com/lisaac/luci-app-diskman.git \
            package/diskman

          make package/symlinks


      # ==========================================================
      # 11. Generate configuration
      # ==========================================================

      - name: Generate configuration
        working-directory: ./openwrt
        run: |

          rm -f .config

          cat > .config <<'EOF'

          # ======================================================
          # Target
          # ======================================================

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y


          # ======================================================
          # Firmware
          # ======================================================

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640

          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y

          # ESXi / VMDK
          CONFIG_VMDK_IMAGES=y


          # ======================================================
          # LuCI
          # ======================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-package-manager=y

          # Base Chinese
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


          # ======================================================
          # IPv6
          # ======================================================

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y


          # ======================================================
          # Filesystems
          # ======================================================

          CONFIG_PACKAGE_kmod-fs-nfs=y
          CONFIG_PACKAGE_kmod-fs-nfs-common=y
          CONFIG_PACKAGE_kmod-fs-nfs-v3=y
          CONFIG_PACKAGE_kmod-fs-nfs-v4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y


          # ======================================================
          # USB
          # ======================================================

          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ohci-pci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb2-pci=y
          CONFIG_PACKAGE_kmod-usb3=y


          # ======================================================
          # Bonding
          # ======================================================

          CONFIG_PACKAGE_kmod-bonding=y


          # ======================================================
          # SQM / CAKE
          # ======================================================

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y


          # ======================================================
          # OpenVPN
          # ======================================================

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y


          # ======================================================
          # WireGuard
          # ======================================================

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y


          # ======================================================
          # OpenClash
          # ======================================================

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y


          # ======================================================
          # PassWall2
          # ======================================================

          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_sing-box=y


          # ======================================================
          # Lucky
          # ======================================================

          CONFIG_PACKAGE_luci-app-lucky=y


          # ======================================================
          # RTP2HTTPD
          # ======================================================

          CONFIG_PACKAGE_rtp2httpd=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y


          # ======================================================
          # Vlmcsd / KMS
          # ======================================================

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          # ======================================================
          # Argon
          # ======================================================

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y


          # ======================================================
          # Diskman
          # ======================================================

          CONFIG_PACKAGE_luci-app-diskman=y


          # ======================================================
          # UPnP / IGD / NAT-PMP / PCP
          # ======================================================

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y


          # ======================================================
          # IRQ Balance
          # ======================================================

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y


          # ======================================================
          # TTYD
          # ======================================================

          CONFIG_PACKAGE_luci-app-ttyd=y


          # ======================================================
          # Network tools
          # ======================================================

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_wget-ssl=y

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_wget=y

          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y

          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y

          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y


          # ======================================================
          # ESXi tools
          # ======================================================

          CONFIG_PACKAGE_open-vm-tools=y


          # ======================================================
          # Firewall
          # ======================================================

          CONFIG_PACKAGE_firewall4=y


          # ======================================================
          # CCache
          # ======================================================

          CONFIG_CCACHE=y

          EOF


          # ------------------------------------------------------
          # Optional Chinese localization packages
          #
          # Only add a localization package when the current
          # package trees actually provide it. This prevents a
          # missing third-party i18n package from killing a build.
          # ------------------------------------------------------

          has_package() {
            PKG="$1"
            grep -Rqs \
              --include='Makefile' \
              "^Package/${PKG}" \
              package \
              feeds \
              2>/dev/null
          }

          for PKG in \
            luci-i18n-package-manager-zh-cn \
            luci-i18n-firewall-zh-cn \
            luci-i18n-openvpn-zh-cn \
            luci-i18n-wireguard-zh-cn \
            luci-i18n-sqm-zh-cn \
            luci-i18n-upnp-zh-cn \
            luci-i18n-irqbalance-zh-cn \
            luci-i18n-ttyd-zh-cn \
            luci-i18n-passwall2-zh-cn \
            luci-i18n-lucky-zh-cn \
            luci-i18n-rtp2httpd-zh-cn \
            luci-i18n-vlmcsd-zh-cn \
            luci-i18n-argon-config-zh-cn \
            luci-i18n-diskman-zh-cn
          do
            if has_package "$PKG"; then
              echo "CONFIG_PACKAGE_${PKG}=y" >> .config
              echo "[ OK ] ${PKG}"
            else
              echo "[SKIP] ${PKG} not provided by current feeds"
            fi
          done


          # ------------------------------------------------------
          # Resolve dependencies
          # ------------------------------------------------------

          make defconfig


          echo ""
          echo "Selected packages:"
          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|luci-i18n-passwall2-zh-cn|luci-app-lucky|luci-i18n-lucky-zh-cn|luci-app-rtp2httpd|luci-i18n-rtp2httpd-zh-cn|vlmcsd|luci-app-vlmcsd|luci-i18n-vlmcsd-zh-cn|luci-app-sqm|luci-i18n-sqm-zh-cn|luci-app-openvpn|luci-i18n-openvpn-zh-cn|wireguard-tools|luci-i18n-wireguard-zh-cn|luci-theme-argon|luci-app-argon-config|luci-i18n-argon-config-zh-cn|luci-app-diskman|luci-i18n-diskman-zh-cn|miniupnpd-nftables|luci-app-upnp|luci-i18n-upnp-zh-cn|luci-i18n-base-zh-cn)' \
            .config || true


      # ==========================================================
      # 12. First-boot test mode
      #
      # 25.12 is prepared as a secondary ESXi test router:
      #
      # LAN IP : 192.168.1.211
      # Gateway: 192.168.1.1
      # DNS    : 192.168.1.1
      # DHCP   : OFF
      #
      # This avoids conflict with the existing LEDE 192.168.1.1.
      # ==========================================================

      - name: Configure first-boot test network
        working-directory: ./openwrt
        run: |

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-25-12-test-network <<'EOF'
          #!/bin/sh

          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.1.211'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.gateway='192.168.1.1'

          uci -q delete network.lan.dns
          uci add_list network.lan.dns='192.168.1.1'

          uci set dhcp.lan.ignore='1'

          uci commit network
          uci commit dhcp

          rm -f "$0"

          exit 0
          EOF

          chmod +x \
            files/etc/uci-defaults/99-25-12-test-network


      # ==========================================================
      # 13. Remove invalid third-party runtime APK feeds
      #
      # Build-time feeds remain available.
      # Only the incorrect runtime distfeeds entries are removed.
      # ==========================================================

      - name: Add runtime APK feed cleanup
        working-directory: ./openwrt
        run: |

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-25-12-clean-apk-feeds <<'EOF'
          #!/bin/sh

          FEEDS="/etc/apk/repositories.d/distfeeds.list"

          if [ -f "$FEEDS" ]; then
            sed -i -E \
              '/\/packages\/x86_64\/(passwall|passwall2|passwall_packages|sbwml)\/packages\.adb$/d' \
              "$FEEDS"
          fi

          rm -f "$0"

          exit 0
          EOF

          chmod +x \
            files/etc/uci-defaults/99-25-12-clean-apk-feeds


      # ==========================================================
      # 14. Prerequisites
      # ==========================================================

      - name: Check prerequisites
        working-directory: ./openwrt
        run: |
          make prereq


      # ==========================================================
      # 15. Download
      # ==========================================================

      - name: Download sources
        working-directory: ./openwrt
        run: |
          make download -j8 V=s


      # ==========================================================
      # 16. Compile
      # ==========================================================

      - name: Compile firmware
        working-directory: ./openwrt
        run: |

          echo "========================================"
          echo "OpenWrt 25.12 build started"
          echo "$BUILD_TIME"
          echo "========================================"

          make -j$(nproc) || \
          make -j1 V=s

          echo "========================================"
          echo "OpenWrt 25.12 build finished"
          echo "========================================"

          date


      # ==========================================================
      # 17. Verify generated images
      # ==========================================================

      - name: Verify firmware
        working-directory: ./openwrt
        run: |

          set -e

          TARGET="bin/targets/x86/64"

          echo "Generated firmware:"
          find "$TARGET" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


          EFI="$(find "$TARGET" \
            -maxdepth 1 \
            -type f \
            -name '*generic-squashfs-combined-efi.img.gz' \
            | head -n 1)"

          VMDK="$(find "$TARGET" \
            -maxdepth 1 \
            -type f \
            -name '*.vmdk' \
            | head -n 1)"


          if [ -z "$EFI" ]; then
            echo ""
            echo "ERROR: EFI image not found."
            exit 1
          fi

          if [ -z "$VMDK" ]; then
            echo ""
            echo "ERROR: VMDK image not found."
            exit 1
          fi


          echo ""
          echo "EFI:"
          echo "$EFI"
          ls -lh "$EFI"

          echo ""
          echo "VMDK:"
          echo "$VMDK"
          ls -lh "$VMDK"


      # ==========================================================
      # 18. Prepare artifacts
      # ==========================================================

      - name: Prepare artifacts
        working-directory: ./openwrt
        run: |

          set -e

          TARGET="bin/targets/x86/64"

          rm -rf artifact

          mkdir -p \
            artifact/firmware \
            artifact/buildinfo


          # EFI
          EFI="$(find "$TARGET" \
            -maxdepth 1 \
            -type f \
            -name '*generic-squashfs-combined-efi.img.gz' \
            | head -n 1)"

          cp "$EFI" \
            "artifact/firmware/OpenWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img.gz"


          # ESXi VMDK
          VMDK="$(find "$TARGET" \
            -maxdepth 1 \
            -type f \
            -name '*.vmdk' \
            | head -n 1)"

          cp "$VMDK" \
            "artifact/firmware/OpenWrt-25.12-x86-64-ESXi-${BUILD_DATE}.vmdk"


          # SHA256
          cd artifact/firmware

          sha256sum * > SHA256SUMS

          cd ../..


          # Build information
          cp .config \
            artifact/buildinfo/config.final

          git log -1 --format=fuller \
            > artifact/buildinfo/source.commit

          git describe --always --dirty \
            > artifact/buildinfo/source.version


          find "$TARGET" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.buildinfo' \
              -o \
              -name '*.manifest' \
              -o \
              -name '*.bom.cdx.json' \
            \) \
            -exec cp {} artifact/buildinfo/ \;


          echo ""
          echo "========================================"
          echo "Firmware"
          echo "========================================"

          ls -lh artifact/firmware

          echo ""
          echo "========================================"
          echo "BuildInfo"
          echo "========================================"

          ls -lh artifact/buildinfo


      # ==========================================================
      # 19. Upload firmware
      # ==========================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12-x86-64-Firmware-${{ env.BUILD_DATE }}
          path: ./openwrt/artifact/firmware/*
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 20. Upload BuildInfo
      # ==========================================================

      - name: Upload BuildInfo
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12-x86-64-BuildInfo-${{ env.BUILD_DATE }}
          path: ./openwrt/artifact/buildinfo/*
          if-no-files-found: error
          retention-days: 30
