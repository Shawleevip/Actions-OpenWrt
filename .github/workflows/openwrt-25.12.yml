name: OpenWrt 25.12 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_BRANCH: openwrt-25.12
  OPENWRT_DIR: openwrt
  TZ: Asia/Shanghai

jobs:
  build:
    name: OpenWrt 25.12 x86_64
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Maximize build space
      # ==========================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ==========================================================
      # 3. Install build dependencies
      # ==========================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive

        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc \
            zstd

          sudo timedatectl set-timezone Asia/Shanghai


      # ==========================================================
      # 4. Build information
      # ==========================================================

      - name: Set build information
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"


      # ==========================================================
      # 5. Restore ccache
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-25.12-x86_64-${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}
          restore-keys: |
            openwrt-25.12-x86_64-${{ runner.os }}-ccache-


      # ==========================================================
      # 6. Clone official OpenWrt
      # ==========================================================

      - name: Clone official OpenWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$OPENWRT_BRANCH" \
            https://github.com/openwrt/openwrt.git \
            "$OPENWRT_DIR"

          cd "$OPENWRT_DIR"

          echo "========================================"
          echo "OpenWrt source"
          echo "========================================"

          git log -1 --oneline
          git describe --always --dirty


      # ==========================================================
      # 7. Restore download cache
      # ==========================================================

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12-x86_64-${{ runner.os }}-dl-${{ hashFiles('.github/workflows/openwrt-25.12.yml') }}
          restore-keys: |
            openwrt-25.12-x86_64-${{ runner.os }}-dl-


      # ==========================================================
      # 8. Configure third-party feeds
      # ==========================================================

      - name: Configure third-party feeds
        working-directory: ./openwrt
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          src-git sbwml https://github.com/sbwml/openwrt_pkgs.git;main
          EOF


      # ==========================================================
      # 9. Update and install feeds
      # ==========================================================

      - name: Update feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ==========================================================
      # 10. Add OpenClash
      # ==========================================================

      - name: Add OpenClash
        working-directory: ./openwrt
        run: |
          rm -rf /tmp/openclash
          rm -rf package/luci-app-openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/openclash

          cp -a \
            /tmp/openclash/luci-app-openclash \
            package/luci-app-openclash

          test -f package/luci-app-openclash/Makefile


      # ==========================================================
      # 11. Add Lucky
      # ==========================================================

      - name: Add Lucky
        working-directory: ./openwrt
        run: |
          rm -rf /tmp/lucky
          rm -rf package/lucky
          rm -rf package/luci-app-lucky

          git clone \
            --depth 1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            /tmp/lucky

          cp -a \
            /tmp/lucky/lucky \
            package/lucky

          cp -a \
            /tmp/lucky/luci-app-lucky \
            package/luci-app-lucky


      # ==========================================================
      # 12. Add Argon
      # ==========================================================

      - name: Add Argon
        working-directory: ./openwrt
        run: |
          rm -rf \
            package/luci-theme-argon \
            package/luci-app-argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config


      # ==========================================================
      # 13. Add Diskman
      # ==========================================================

      - name: Add Diskman
        working-directory: ./openwrt
        run: |
          rm -rf package/diskman

          git clone \
            --depth 1 \
            https://github.com/lisaac/luci-app-diskman.git \
            package/diskman


      # ==========================================================
      # 14. Prepare package symlinks
      # ==========================================================

      - name: Prepare package symlinks
        working-directory: ./openwrt
        run: |
          make package/symlinks


      # ==========================================================
      # 15. Generate configuration
      #
      # IMPORTANT:
      #
      # No dynamic package detection.
      # No custom uci-defaults.
      # No VMDK.
      # No wget.
      #
      # Keep .config as a plain Kconfig file.
      # ==========================================================

      - name: Generate configuration
        working-directory: ./openwrt
        run: |
          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_GRUB_EFI_IMAGES=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y

          CONFIG_PACKAGE_kmod-fs-nfs=y
          CONFIG_PACKAGE_kmod-fs-nfs-common=y
          CONFIG_PACKAGE_kmod-fs-nfs-v3=y
          CONFIG_PACKAGE_kmod-fs-nfs-v4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y

          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ohci-pci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb2-pci=y
          CONFIG_PACKAGE_kmod-usb3=y

          CONFIG_PACKAGE_kmod-bonding=y

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y

          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y

          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_lucky=y

          CONFIG_PACKAGE_rtp2httpd=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          CONFIG_PACKAGE_luci-app-diskman=y

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y

          CONFIG_PACKAGE_luci-app-ttyd=y

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y

          CONFIG_PACKAGE_open-vm-tools=y

          CONFIG_PACKAGE_firewall4=y

          CONFIG_CCACHE=y
          EOF

          make defconfig


      # ==========================================================
      # 16. Check prerequisites
      # ==========================================================

      - name: Check prerequisites
        working-directory: ./openwrt
        run: |
          make prereq


      # ==========================================================
      # 17. Download sources
      # ==========================================================

      - name: Download sources
        working-directory: ./openwrt
        run: |
          make download -j8 V=s


      # ==========================================================
      # 18. Compile
      # ==========================================================

      - name: Compile firmware
        working-directory: ./openwrt
        run: |
          echo "========================================"
          echo "OpenWrt 25.12 build started"
          echo "$BUILD_TIME"
          echo "========================================"

          make -j$(nproc) || \
          make -j1 V=s

          echo "========================================"
          echo "OpenWrt 25.12 build finished"
          echo "========================================"

          date


      # ==========================================================
      # 19. Prepare artifacts
      # ==========================================================

      - name: Prepare artifacts
        working-directory: ./openwrt
        run: |
          set -e

          TARGET="bin/targets/x86/64"

          rm -rf artifact

          mkdir -p \
            artifact/firmware \
            artifact/buildinfo

          EFI_IMAGE="$(find "$TARGET" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*generic-squashfs-combined-efi.img.gz' \
              -o \
              -name '*combined-efi.img.gz' \
              -o \
              -name '*combined-efi.img' \
            \) \
            | head -n 1)"

          test -n "$EFI_IMAGE"

          case "$EFI_IMAGE" in
            *.gz)
              cp "$EFI_IMAGE" \
                "artifact/firmware/OpenWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img.gz"
              ;;
            *)
              cp "$EFI_IMAGE" \
                "artifact/firmware/OpenWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img"
              ;;
          esac

          cd artifact/firmware
          sha256sum * > SHA256SUMS
          cd ../..

          cp .config \
            artifact/buildinfo/config.final

          git log -1 --format=fuller \
            > artifact/buildinfo/source.commit

          git describe --always --dirty \
            > artifact/buildinfo/source.version

          find "$TARGET" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.buildinfo' \
              -o \
              -name '*.manifest' \
              -o \
              -name '*.bom.cdx.json' \
            \) \
            -exec cp {} artifact/buildinfo/ \;

          echo ""
          echo "========================================"
          echo "Firmware"
          echo "========================================"

          ls -lh artifact/firmware

          echo ""
          echo "========================================"
          echo "BuildInfo"
          echo "========================================"

          ls -lh artifact/buildinfo


      # ==========================================================
      # 20. Upload firmware
      # ==========================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12-x86-64-Firmware-${{ env.BUILD_DATE }}
          path: ./openwrt/artifact/firmware/*
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 21. Upload build information
      # ==========================================================

      - name: Upload BuildInfo
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12-x86-64-BuildInfo-${{ env.BUILD_DATE }}
          path: ./openwrt/artifact/buildinfo/*
          if-no-files-found: error
          retention-days: 30
