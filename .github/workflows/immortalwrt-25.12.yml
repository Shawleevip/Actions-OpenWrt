name: ImmortalWrt 25.12 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTAL_BRANCH: openwrt-25.12
  IMMORTAL_DIR: immortalwrt
  TZ: Asia/Shanghai

jobs:
  build:
    name: ImmortalWrt 25.12 x86_64
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Maximize build space
      # ==========================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ==========================================================
      # 3. Build dependencies
      # ==========================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive

        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc \
            zstd

          sudo timedatectl set-timezone Asia/Shanghai


      # ==========================================================
      # 4. Build information
      # ==========================================================

      - name: Set build information
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"


      # ==========================================================
      # 5. CCache
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: immortalwrt-25.12-x86_64-${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/immortalwrt-25.12.yml') }}
          restore-keys: |
            immortalwrt-25.12-x86_64-${{ runner.os }}-ccache-


      # ==========================================================
      # 6. Clone ImmortalWrt
      # ==========================================================

      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$IMMORTAL_BRANCH" \
            https://github.com/immortalwrt/immortalwrt.git \
            "$IMMORTAL_DIR"

          cd "$IMMORTAL_DIR"

          echo "========================================"
          echo "ImmortalWrt source"
          echo "========================================"

          git log -1 --oneline
          git describe --always --dirty


      # ==========================================================
      # 7. Download cache
      # ==========================================================

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: immortalwrt-25.12-x86_64-${{ runner.os }}-dl-${{ hashFiles('.github/workflows/immortalwrt-25.12.yml') }}
          restore-keys: |
            immortalwrt-25.12-x86_64-${{ runner.os }}-dl-


      # ==========================================================
      # 8. Official feeds
      # ==========================================================

      - name: Update official feeds
        working-directory: ./immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ==========================================================
      # 9. OpenClash
      # ==========================================================

      - name: Add OpenClash
        working-directory: ./immortalwrt
        run: |
          rm -rf /tmp/openclash
          rm -rf package/luci-app-openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/openclash

          cp -a \
            /tmp/openclash/luci-app-openclash \
            package/luci-app-openclash

          test -f package/luci-app-openclash/Makefile

          echo "OpenClash installed."


      # ==========================================================
      # 10. PassWall2
      # ==========================================================

      - name: Add PassWall2
        working-directory: ./immortalwrt
        run: |
          rm -rf /tmp/passwall2
          rm -rf package/passwall2

          git clone \
            --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
            /tmp/passwall2

          cp -a \
            /tmp/passwall2 \
            package/passwall2

          echo "PassWall2 installed."


      # ==========================================================
      # 11. Lucky
      # ==========================================================

      - name: Add Lucky
        working-directory: ./immortalwrt
        run: |
          rm -rf package/lucky

          git clone \
            --depth 1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky

          test -d package/lucky/lucky
          test -d package/lucky/luci-app-lucky

          echo "Lucky installed."


      # ==========================================================
      # 12. RTP2HTTPD
      # ==========================================================

      - name: Add RTP2HTTPD
        working-directory: ./immortalwrt
        run: |
          rm -rf package/rtp2httpd

          git clone \
            --depth 1 \
            https://github.com/stackia/rtp2httpd.git \
            package/rtp2httpd

          echo "RTP2HTTPD installed."


      # ==========================================================
      # 13. Argon
      # ==========================================================

      - name: Add Argon
        working-directory: ./immortalwrt
        run: |
          rm -rf \
            package/luci-theme-argon \
            package/luci-app-argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config

          test -f package/luci-theme-argon/Makefile
          test -f package/luci-app-argon-config/Makefile

          echo "Argon installed."


      # ==========================================================
      # 14. Diskman
      # ==========================================================

      - name: Add Diskman
        working-directory: ./immortalwrt
        run: |
          rm -rf package/diskman

          git clone \
            --depth 1 \
            https://github.com/lisaac/luci-app-diskman.git \
            package/diskman

          echo "Diskman installed."


      # ==========================================================
      # 15. Vlmcsd / KMS
      # ==========================================================

      - name: Add Vlmcsd
        working-directory: ./immortalwrt
        run: |

          if grep -Rqs \
            "Package/vlmcsd" \
            feeds package \
            2>/dev/null && \
             grep -Rqs \
            "Package/luci-app-vlmcsd" \
            feeds package \
            2>/dev/null; then

            echo "Official Vlmcsd package found."

          else

            echo "Official Vlmcsd package not found."
            echo "Using sbwml/openwrt_pkgs fallback."

            rm -rf package/vlmcsd

            git clone \
              --filter=blob:none \
              --no-checkout \
              --depth 1 \
              https://github.com/sbwml/openwrt_pkgs.git \
              package/vlmcsd

            cd package/vlmcsd

            git sparse-checkout init --cone

            git sparse-checkout set \
              vlmcsd \
              luci-app-vlmcsd

            git checkout

            cd ../..

          fi


      # ==========================================================
      # 16. Package symlinks
      # ==========================================================

      - name: Prepare package symlinks
        working-directory: ./immortalwrt
        run: |
          make package/symlinks


      # ==========================================================
      # 17. Generate configuration
      # ==========================================================

      - name: Generate configuration
        working-directory: ./immortalwrt
        run: |

          cat > .config <<'EOF'

          # ======================================================
          # Target
          # ======================================================

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y


          # ======================================================
          # Kernel / RootFS
          # ======================================================

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y


          # ======================================================
          # x86 boot / EFI / ESXi
          #
          # ImmortalWrt 25.12 uses GRUB image options here.
          # ======================================================

          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_VMDK_IMAGES=y


          # ======================================================
          # LuCI / Chinese
          # ======================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y


          # ======================================================
          # IPv6
          # ======================================================

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y


          # ======================================================
          # Filesystems
          # ======================================================

          CONFIG_PACKAGE_kmod-fs-nfs=y
          CONFIG_PACKAGE_kmod-fs-nfs-common=y
          CONFIG_PACKAGE_kmod-fs-nfs-v3=y
          CONFIG_PACKAGE_kmod-fs-nfs-v4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y


          # ======================================================
          # USB
          # ======================================================

          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ohci-pci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb2-pci=y
          CONFIG_PACKAGE_kmod-usb3=y


          # ======================================================
          # Bonding
          # ======================================================

          CONFIG_PACKAGE_kmod-bonding=y


          # ======================================================
          # SQM / CAKE
          # ======================================================

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y


          # ======================================================
          # OpenVPN
          # ======================================================

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y


          # ======================================================
          # WireGuard
          # ======================================================

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y


          # ======================================================
          # OpenClash
          # ======================================================

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_unzip=y


          # ======================================================
          # PassWall2
          # ======================================================

          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y


          # ======================================================
          # Lucky
          # ======================================================

          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_lucky=y


          # ======================================================
          # RTP2HTTPD
          # ======================================================

          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          CONFIG_PACKAGE_rtp2httpd=y


          # ======================================================
          # Vlmcsd / KMS
          # ======================================================

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          # ======================================================
          # Argon
          # ======================================================

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y


          # ======================================================
          # Diskman
          # ======================================================

          CONFIG_PACKAGE_luci-app-diskman=y


          # ======================================================
          # UPnP / IGD / NAT-PMP / PCP
          # ======================================================

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y


          # ======================================================
          # IRQBalance
          # ======================================================

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y


          # ======================================================
          # TTYD
          # ======================================================

          CONFIG_PACKAGE_luci-app-ttyd=y


          # ======================================================
          # Common tools
          # ======================================================

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y

          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y


          # ======================================================
          # ESXi
          # ======================================================

          CONFIG_PACKAGE_open-vm-tools=y


          # ======================================================
          # Firewall
          # ======================================================

          CONFIG_PACKAGE_firewall4=y


          # ======================================================
          # CCache
          # ======================================================

          CONFIG_CCACHE=y

          EOF


          # ======================================================
          # Optional Chinese packages
          #
          # Only select a package when the current source tree
          # really provides it.
          # ======================================================

          has_package() {
            PKG="$1"

            grep -Rqs \
              --include='Makefile' \
              "^Package/${PKG}" \
              package \
              feeds \
              2>/dev/null
          }

          for PKG in \
            luci-i18n-firewall-zh-cn \
            luci-i18n-openvpn-zh-cn \
            luci-i18n-wireguard-zh-cn \
            luci-i18n-sqm-zh-cn \
            luci-i18n-upnp-zh-cn \
            luci-i18n-irqbalance-zh-cn \
            luci-i18n-ttyd-zh-cn \
            luci-i18n-passwall2-zh-cn \
            luci-i18n-lucky-zh-cn \
            luci-i18n-rtp2httpd-zh-cn \
            luci-i18n-vlmcsd-zh-cn \
            luci-i18n-argon-config-zh-cn \
            luci-i18n-diskman-zh-cn
          do
            if has_package "$PKG"; then
              echo "CONFIG_PACKAGE_${PKG}=y" >> .config
              echo "[ OK ] ${PKG}"
            else
              echo "[SKIP] ${PKG}"
            fi
          done


          # ======================================================
          # Resolve configuration
          # ======================================================

          make defconfig


          echo ""
          echo "========================================"
          echo "Image configuration"
          echo "========================================"

          grep -E \
            '^CONFIG_(TARGET_x86|TARGET_x86_64|GRUB_IMAGES|GRUB_EFI_IMAGES|VMDK_IMAGES|TARGET_ROOTFS_EXT4FS|TARGET_IMAGES_GZIP)=' \
            .config \
            || true


      # ==========================================================
      # 18. Verify final configuration
      # ==========================================================

      - name: Verify final configuration
        working-directory: ./immortalwrt
        run: |

          set -e

          REQUIRED="
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y

          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_VMDK_IMAGES=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-sqm=y

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          CONFIG_PACKAGE_luci-app-diskman=y

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          "

          echo "========================================"
          echo "Verifying final configuration"
          echo "========================================"

          for item in $REQUIRED; do

            if grep -qx "$item" .config; then
              echo "[ OK ] $item"
            else
              echo "[FAIL] $item"
              exit 1
            fi

          done

          echo ""
          echo "Configuration verified successfully."


      # ==========================================================
      # 19. First-boot test network
      #
      # ESXi A/B test mode:
      #
      # 25.12 LAN : 192.168.1.211/24
      # Gateway    : 192.168.1.1
      # DNS        : 192.168.1.1
      # DHCP       : OFF
      #
      # This allows the new firmware to coexist with the old LEDE.
      # ==========================================================

      - name: Configure first-boot test network
        working-directory: ./immortalwrt
        run: |

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-immortal-25-12-test-network <<'EOF'
          #!/bin/sh

          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.1.211'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.gateway='192.168.1.1'

          uci -q delete network.lan.dns
          uci add_list network.lan.dns='192.168.1.1'

          uci set dhcp.lan.ignore='1'

          uci commit network
          uci commit dhcp

          rm -f "$0"

          exit 0
          EOF

          chmod +x \
            files/etc/uci-defaults/99-immortal-25-12-test-network


      # ==========================================================
      # 20. Clean invalid runtime APK feed entries
      #
      # Build feeds remain available for compilation.
      # This only removes stale third-party repositories from the
      # runtime distfeeds list when they were accidentally created.
      # ==========================================================

      - name: Add runtime APK feed cleanup
        working-directory: ./immortalwrt
        run: |

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-immortal-25-12-clean-apk-feeds <<'EOF'
          #!/bin/sh

          FEEDS="/etc/apk/repositories.d/distfeeds.list"

          if [ -f "$FEEDS" ]; then
            sed -i -E \
              '/\/packages\/x86_64\/(passwall|passwall2|passwall_packages|sbwml)\/packages\.adb$/d' \
              "$FEEDS"
          fi

          rm -f "$0"

          exit 0
          EOF

          chmod +x \
            files/etc/uci-defaults/99-immortal-25-12-clean-apk-feeds


      # ==========================================================
      # 21. Prerequisites
      # ==========================================================

      - name: Check prerequisites
        working-directory: ./immortalwrt
        run: |
          make prereq


      # ==========================================================
      # 22. Download sources
      # ==========================================================

      - name: Download sources
        working-directory: ./immortalwrt
        run: |
          make download -j8 V=s


      # ==========================================================
      # 23. Compile
      # ==========================================================

      - name: Compile firmware
        working-directory: ./immortalwrt
        run: |

          echo "========================================"
          echo "ImmortalWrt 25.12 build started"
          echo "$BUILD_TIME"
          echo "========================================"

          make -j$(nproc) || \
          make -j1 V=s

          echo "========================================"
          echo "ImmortalWrt 25.12 build finished"
          echo "========================================"

          date


      # ==========================================================
      # 24. Verify generated images
      # ==========================================================

      - name: Verify firmware
        working-directory: ./immortalwrt
        run: |

          set -e

          TARGET_DIR="bin/targets/x86/64"

          echo "========================================"
          echo "Generated firmware"
          echo "========================================"

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


          EFI_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*generic-ext4-combined-efi.img.gz' \
              -o \
              -name '*generic-squashfs-combined-efi.img.gz' \
              -o \
              -name '*combined-efi.img.gz' \
              -o \
              -name '*combined-efi.img' \
            \) \
            | head -n 1)"


          VMDK_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*generic-ext4-combined-efi.vmdk' \
              -o \
              -name '*generic-squashfs-combined-efi.vmdk' \
              -o \
              -name '*combined-efi.vmdk' \
              -o \
              -name '*generic-ext4-combined-efi.vmdk.gz' \
              -o \
              -name '*generic-squashfs-combined-efi.vmdk.gz' \
              -o \
              -name '*combined-efi.vmdk.gz' \
            \) \
            | head -n 1)"


          if [ -z "$EFI_IMAGE" ]; then
            echo ""
            echo "ERROR: EFI image not found."
            exit 1
          fi


          if [ -z "$VMDK_IMAGE" ]; then
            echo ""
            echo "ERROR: EFI VMDK image not found."
            echo ""
            echo "The image configuration should contain:"
            echo "CONFIG_GRUB_IMAGES=y"
            echo "CONFIG_GRUB_EFI_IMAGES=y"
            echo "CONFIG_VMDK_IMAGES=y"
            exit 1
          fi


          echo ""
          echo "EFI image:"
          echo "$EFI_IMAGE"
          ls -lh "$EFI_IMAGE"


          echo ""
          echo "VMDK image:"
          echo "$VMDK_IMAGE"
          ls -lh "$VMDK_IMAGE"


      # ==========================================================
      # 25. Prepare artifacts
      # ==========================================================

      - name: Prepare artifacts
        working-directory: ./immortalwrt
        run: |

          set -e

          TARGET_DIR="bin/targets/x86/64"

          rm -rf artifact

          mkdir -p \
            artifact/firmware \
            artifact/buildinfo


          # ------------------------------------------------------
          # EFI image
          # ------------------------------------------------------

          EFI_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*generic-ext4-combined-efi.img.gz' \
              -o \
              -name '*generic-squashfs-combined-efi.img.gz' \
              -o \
              -name '*combined-efi.img.gz' \
              -o \
              -name '*combined-efi.img' \
            \) \
            | head -n 1)"

          test -n "$EFI_IMAGE"


          case "$EFI_IMAGE" in
            *.gz)
              cp "$EFI_IMAGE" \
                "artifact/firmware/ImmortalWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img.gz"
              ;;
            *)
              cp "$EFI_IMAGE" \
                "artifact/firmware/ImmortalWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img"
              ;;
          esac


          # ------------------------------------------------------
          # VMDK
          #
          # If ImmortalWrt generated .vmdk.gz, decompress it so
          # the resulting artifact can be used directly by ESXi.
          # ------------------------------------------------------

          VMDK_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*generic-ext4-combined-efi.vmdk' \
              -o \
              -name '*generic-squashfs-combined-efi.vmdk' \
              -o \
              -name '*combined-efi.vmdk' \
              -o \
              -name '*generic-ext4-combined-efi.vmdk.gz' \
              -o \
              -name '*generic-squashfs-combined-efi.vmdk.gz' \
              -o \
              -name '*combined-efi.vmdk.gz' \
            \) \
            | head -n 1)"

          test -n "$VMDK_IMAGE"


          case "$VMDK_IMAGE" in
            *.vmdk.gz)
              gzip -dc "$VMDK_IMAGE" \
                > "artifact/firmware/ImmortalWrt-25.12-x86-64-ESXi-${BUILD_DATE}.vmdk"
              ;;
            *)
              cp "$VMDK_IMAGE" \
                "artifact/firmware/ImmortalWrt-25.12-x86-64-ESXi-${BUILD_DATE}.vmdk"
              ;;
          esac


          # ------------------------------------------------------
          # SHA256
          # ------------------------------------------------------

          cd artifact/firmware

          sha256sum * > SHA256SUMS

          cd ../..


          # ------------------------------------------------------
          # Build information
          # ------------------------------------------------------

          cp .config \
            artifact/buildinfo/config.final

          git log -1 --format=fuller \
            > artifact/buildinfo/source.commit

          git describe --always --dirty \
            > artifact/buildinfo/source.version


          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.buildinfo' \
              -o \
              -name '*.manifest' \
              -o \
              -name '*.bom.cdx.json' \
            \) \
            -exec cp {} artifact/buildinfo/ \;


          echo ""
          echo "========================================"
          echo "Firmware"
          echo "========================================"

          ls -lh artifact/firmware


          echo ""
          echo "========================================"
          echo "BuildInfo"
          echo "========================================"

          ls -lh artifact/buildinfo


      # ==========================================================
      # 26. Upload firmware
      # ==========================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-x86-64-Firmware-${{ env.BUILD_DATE }}
          path: ./immortalwrt/artifact/firmware/*
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 27. Upload BuildInfo
      # ==========================================================

      - name: Upload BuildInfo
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-x86-64-BuildInfo-${{ env.BUILD_DATE }}
          path: ./immortalwrt/artifact/buildinfo/*
          if-no-files-found: error
          retention-days: 30
