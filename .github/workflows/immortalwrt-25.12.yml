name: ImmortalWrt 25.12 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTAL_BRANCH: openwrt-25.12
  IMMORTAL_DIR: immortalwrt
  TZ: Asia/Shanghai

jobs:

  build:

    name: ImmortalWrt 25.12 x86_64

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout build repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Maximize build space
      # ============================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192

          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ============================================================
      # 3. Build dependencies
      # ============================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive

        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc \
            zstd

          sudo timedatectl set-timezone Asia/Shanghai


      # ============================================================
      # 4. Build information
      # ============================================================

      - name: Set build information
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"


      # ============================================================
      # 5. Restore ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4

        with:
          path: ~/.ccache

          key: immortalwrt-25.12-x86_64-${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/immortalwrt-25.12.yml') }}

          restore-keys: |
            immortalwrt-25.12-x86_64-${{ runner.os }}-ccache-


      # ============================================================
      # 6. Clone ImmortalWrt
      # ============================================================

      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$IMMORTAL_BRANCH" \
            https://github.com/immortalwrt/immortalwrt.git \
            "$IMMORTAL_DIR"

          cd "$IMMORTAL_DIR"

          echo "========================================"
          echo "ImmortalWrt source"
          echo "========================================"

          git log -1 --oneline
          git describe --always --dirty

          echo ""
          echo "Kernel configuration:"
          grep -R \
            "LINUX_VERSION" \
            include \
            target/linux \
            2>/dev/null \
            | head -20 \
            || true

          echo "========================================"


      # ============================================================
      # 7. Restore download cache
      # ============================================================

      - name: Restore download cache
        uses: actions/cache@v4

        with:
          path: |
            immortalwrt/dl

          key: immortalwrt-25.12-x86_64-dl-${{ runner.os }}-${{ hashFiles('.github/workflows/immortalwrt-25.12.yml') }}

          restore-keys: |
            immortalwrt-25.12-x86_64-dl-${{ runner.os }}-


      # ============================================================
      # 8. Official ImmortalWrt feeds
      # ============================================================

      - name: Update official feeds
        working-directory: ./immortalwrt

        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ============================================================
      # 9. Add OpenClash
      #
      # IMPORTANT:
      # OpenClash repository contains:
      #
      # luci-app-openclash/
      #
      # Therefore clone repository to temporary location and copy
      # the actual package directory into package/.
      # ============================================================

      - name: Add OpenClash
        working-directory: ./immortalwrt

        run: |
          rm -rf /tmp/openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/openclash

          rm -rf package/luci-app-openclash

          cp -a \
            /tmp/openclash/luci-app-openclash \
            package/luci-app-openclash

          echo "========================================"
          echo "OpenClash package"
          echo "========================================"

          test -f package/luci-app-openclash/Makefile

          grep '^PKG_NAME' \
            package/luci-app-openclash/Makefile

          echo "OpenClash package installed."


      # ============================================================
      # 10. Add PassWall2
      # ============================================================

      - name: Add PassWall2
        working-directory: ./immortalwrt

        run: |
          rm -rf /tmp/passwall2

          git clone \
            --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
            /tmp/passwall2

          rm -rf package/passwall2

          cp -a \
            /tmp/passwall2 \
            package/passwall2

          echo "========================================"
          echo "PassWall2"
          echo "========================================"

          find package/passwall2 \
            -maxdepth 3 \
            -name Makefile \
            -print

          echo "PassWall2 source installed."


      # ============================================================
      # 11. Lucky
      # ============================================================

      - name: Add Lucky

        working-directory: ./immortalwrt

        run: |
          set -euxo pipefail

          rm -rf package/lucky

          echo "========================================"
          echo "Installing Lucky LuCI package"
          echo "========================================"

          git clone \
            --depth 1 \
            --single-branch \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky

          echo ""
          echo "========================================"
          echo "Lucky repository information"
          echo "========================================"

          cd package/lucky

          echo "Commit:"
          git log -1 --oneline

          echo ""
          echo "Branch:"
          git branch --show-current || true

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Checking Makefile..."

          test -f Makefile

          echo ""
          echo "Checking package definition..."

          grep -Rqs \
            "Package/luci-app-lucky" \
            . || {
              echo "[ERROR] luci-app-lucky package definition not found!"
              exit 1
            }

          echo ""
          echo "========================================"
          echo "Lucky package installed successfully."
          echo "========================================"

      # ============================================================
      # 12. Add RTP2HTTPD
      # ============================================================

      - name: Add RTP2HTTPD
        working-directory: ./immortalwrt

        run: |
          rm -rf package/rtp2httpd

          git clone \
            --depth 1 \
            https://github.com/stackia/rtp2httpd.git \
            package/rtp2httpd

          echo "RTP2HTTPD installed."


      # ============================================================
      # 13. Vlmcsd
      #
      # IMPORTANT:
      # ImmortalWrt official feeds already provide vlmcsd.
      #
      # Do NOT import sbwml/openwrt_pkgs.
      # ============================================================

      - name: Verify Vlmcsd
        working-directory: ./immortalwrt

        run: |
          echo "========================================"
          echo "Checking official Vlmcsd packages"
          echo "========================================"

          grep -Rqs \
            "Package/vlmcsd" \
            package \
            feeds

          grep -Rqs \
            "Package/luci-app-vlmcsd" \
            package \
            feeds

          echo "[OK] vlmcsd"
          echo "[OK] luci-app-vlmcsd"


      # ============================================================
      # 14. Add Argon
      # ============================================================

      - name: Add Argon
        working-directory: ./immortalwrt

        run: |
          rm -rf \
            package/luci-theme-argon \
            package/luci-app-argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config

          test -f package/luci-theme-argon/Makefile
          test -f package/luci-app-argon-config/Makefile

          echo "Argon installed."


      # ============================================================
      # 15. Diskman
      # ============================================================

      - name: Add Diskman
        working-directory: ./immortalwrt

        run: |
          rm -rf package/diskman

          git clone \
            --depth 1 \
            https://github.com/lisaac/luci-app-diskman.git \
            package/diskman

          echo "Diskman installed."


      # ============================================================
      # 16. Prepare package symlinks
      # ============================================================

      - name: Prepare package symlinks
        working-directory: ./immortalwrt

        run: |
          make package/symlinks


      # ============================================================
      # 17. Verify third-party packages
      #
      # IMPORTANT:
      # Do not use the old grep-only test.
      #
      # We explicitly inspect Makefiles.
      # ============================================================

      - name: Verify package definitions
        working-directory: ./immortalwrt

        run: |
          set -e

          echo "========================================"
          echo "Checking package definitions"
          echo "========================================"

          check_package() {
            NAME="$1"
            PATH="$2"

            if [ ! -f "$PATH/Makefile" ]; then
              echo "[ERROR] $NAME Makefile not found:"
              echo "        $PATH/Makefile"
              exit 1
            fi

            echo "[OK] $NAME"
            grep -m1 '^PKG_NAME' "$PATH/Makefile" || true
          }

          check_package \
            "OpenClash" \
            "package/luci-app-openclash"

          check_package \
            "PassWall2" \
            "package/passwall2"

          check_package \
            "Lucky" \
            "package/lucky"

          check_package \
            "RTP2HTTPD" \
            "package/rtp2httpd"

          check_package \
            "Argon theme" \
            "package/luci-theme-argon"

          check_package \
            "Argon config" \
            "package/luci-app-argon-config"

          check_package \
            "Diskman" \
            "package/diskman"

          echo ""
          echo "========================================"
          echo "Checking official Vlmcsd"
          echo "========================================"

          grep -Rqs \
            "Package/vlmcsd" \
            package \
            feeds

          grep -Rqs \
            "Package/luci-app-vlmcsd" \
            package \
            feeds

          echo "[OK] vlmcsd"
          echo "[OK] luci-app-vlmcsd"

          echo ""
          echo "All package definitions verified."


      # ============================================================
      # 18. Generate configuration
      # ============================================================

      - name: Generate configuration
        working-directory: ./immortalwrt

        run: |

          rm -f .config

          cat > .config <<'EOF'

          # ========================================================
          # Target
          # ========================================================

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y


          # ========================================================
          # Kernel / RootFS
          # ========================================================

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640


          # ========================================================
          # Firmware images
          # ========================================================

          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y
          CONFIG_VMDK_IMAGES=y


          # ========================================================
          # LuCI
          # ========================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y


          # ========================================================
          # IPv6
          # ========================================================

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y


          # ========================================================
          # Filesystems
          # ========================================================

          CONFIG_PACKAGE_kmod-fs-nfs=y
          CONFIG_PACKAGE_kmod-fs-nfs-common=y
          CONFIG_PACKAGE_kmod-fs-nfs-v3=y
          CONFIG_PACKAGE_kmod-fs-nfs-v4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y


          # ========================================================
          # USB
          # ========================================================

          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ohci-pci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb2-pci=y
          CONFIG_PACKAGE_kmod-usb3=y


          # ========================================================
          # Bonding
          # ========================================================

          CONFIG_PACKAGE_kmod-bonding=y


          # ========================================================
          # SQM / CAKE
          # ========================================================

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y


          # ========================================================
          # OpenVPN
          # ========================================================

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y


          # ========================================================
          # WireGuard
          # ========================================================

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y


          # ========================================================
          # OpenClash
          # ========================================================

          CONFIG_PACKAGE_luci-app-openclash=y

          # OpenClash dependencies
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_unzip=y


          # ========================================================
          # PassWall2
          # ========================================================

          CONFIG_PACKAGE_luci-app-passwall2=y

          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_coreutils-nohup=y

          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y


          # ========================================================
          # Lucky
          # ========================================================

          CONFIG_PACKAGE_luci-app-lucky=y


          # ========================================================
          # RTP2HTTPD
          # ========================================================

          CONFIG_PACKAGE_luci-app-rtp2httpd=y


          # ========================================================
          # Vlmcsd / KMS
          # Official ImmortalWrt package
          # ========================================================

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          # ========================================================
          # Argon
          # ========================================================

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y


          # ========================================================
          # Diskman
          # ========================================================

          CONFIG_PACKAGE_luci-app-diskman=y


          # ========================================================
          # Common tools
          # ========================================================

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y


          # ========================================================
          # ESXi
          # ========================================================

          CONFIG_PACKAGE_open-vm-tools=y


          # ========================================================
          # IRQ Balance
          # ========================================================

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y


          # ========================================================
          # LuCI tools
          # ========================================================

          CONFIG_PACKAGE_luci-app-ttyd=y


          # ========================================================
          # Firewall
          # ========================================================

          CONFIG_PACKAGE_firewall4=y


          # ========================================================
          # CCache
          # ========================================================

          CONFIG_CCACHE=y

          EOF


          # Remove indentation introduced by YAML block
          sed -i 's/^[[:space:]]*//' .config


          # ========================================================
          # Resolve dependencies
          # ========================================================

          make defconfig


          echo ""
          echo "========================================"
          echo "Final selected packages"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|luci-app-lucky|luci-app-rtp2httpd|vlmcsd|luci-app-vlmcsd|luci-app-sqm|openvpn-openssl|wireguard-tools|luci-theme-argon|sing-box|xray-core|open-vm-tools)' \
            .config \
            || true


          echo ""
          echo "========================================"
          echo "Image configuration"
          echo "========================================"

          grep -E \
            '^CONFIG_(TARGET_x86|TARGET_KERNEL_PARTSIZE|TARGET_ROOTFS_PARTSIZE|TARGET_IMAGES_GZIP|EFI_IMAGES|VMDK_IMAGES)' \
            .config \
            || true


      # ============================================================
      # 19. Verify final configuration
      # ============================================================

      - name: Verify final configuration
        working-directory: ./immortalwrt

        run: |

          set -e

          echo "========================================"
          echo "Checking final configuration"
          echo "========================================"

          required_configs=(

            "CONFIG_TARGET_x86=y"
            "CONFIG_TARGET_x86_64=y"
            "CONFIG_TARGET_x86_64_Generic=y"

            "CONFIG_EFI_IMAGES=y"
            "CONFIG_VMDK_IMAGES=y"

            "CONFIG_PACKAGE_luci=y"

            "CONFIG_PACKAGE_luci-app-openclash=y"
            "CONFIG_PACKAGE_luci-app-passwall2=y"

            "CONFIG_PACKAGE_luci-app-lucky=y"
            "CONFIG_PACKAGE_luci-app-rtp2httpd=y"

            "CONFIG_PACKAGE_vlmcsd=y"
            "CONFIG_PACKAGE_luci-app-vlmcsd=y"

            "CONFIG_PACKAGE_luci-theme-argon=y"
            "CONFIG_PACKAGE_luci-app-argon-config=y"

            "CONFIG_PACKAGE_luci-app-diskman=y"

            "CONFIG_PACKAGE_luci-app-sqm=y"
            "CONFIG_PACKAGE_kmod-sched-cake=y"

            "CONFIG_PACKAGE_luci-app-openvpn=y"
            "CONFIG_PACKAGE_wireguard-tools=y"

            "CONFIG_PACKAGE_sing-box=y"
            "CONFIG_PACKAGE_xray-core=y"

          )


          for config in "${required_configs[@]}"; do

            if ! grep -qx "$config" .config; then

              echo "[ERROR] Missing configuration:"
              echo "        $config"

              exit 1

            fi

            echo "[OK] $config"

          done


          echo ""
          echo "Final configuration verified."


      # ============================================================
      # 20. Check prerequisites
      # ============================================================

      - name: Check prerequisites
        working-directory: ./immortalwrt

        run: |
          make prereq


      # ============================================================
      # 21. Download sources
      # ============================================================

      - name: Download sources
        working-directory: ./immortalwrt

        run: |
          make download -j8 V=s


      # ============================================================
      # 22. Compile
      # ============================================================

      - name: Compile firmware
        working-directory: ./immortalwrt

        run: |

          echo "========================================"
          echo "ImmortalWrt build started"
          echo "$BUILD_TIME"
          echo "========================================"

          make -j$(nproc) || \
          make -j1 V=s

          echo "========================================"
          echo "ImmortalWrt build finished"
          echo "========================================"

          date


      # ============================================================
      # 23. Verify generated images
      # ============================================================

      - name: Verify firmware
        working-directory: ./immortalwrt

        run: |

          set -e

          TARGET_DIR="bin/targets/x86/64"


          echo "========================================"
          echo "Generated files"
          echo "========================================"

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


          # ========================================================
          # Find EFI image
          #
          # ImmortalWrt image name can vary between revisions.
          # Do not hard-code ext4 only.
          # ========================================================

          EFI_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*combined-efi.img.gz' \
              -o \
              -name '*combined-efi.img' \
            \) \
            | head -n 1)"


          # ========================================================
          # Find VMDK
          # ========================================================

          VMDK_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.vmdk' \
            | head -n 1)"


          if [ -z "$EFI_IMAGE" ]; then

            echo ""
            echo "ERROR: EFI image not found!"
            echo ""

            find "$TARGET_DIR" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n'

            exit 1

          fi


          if [ -z "$VMDK_IMAGE" ]; then

            echo ""
            echo "ERROR: VMDK image not found!"
            echo ""

            find "$TARGET_DIR" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n'

            exit 1

          fi


          echo ""
          echo "========================================"
          echo "EFI image"
          echo "========================================"

          echo "$EFI_IMAGE"


          echo ""
          echo "========================================"
          echo "VMDK image"
          echo "========================================"

          echo "$VMDK_IMAGE"


          echo ""
          echo "========================================"
          echo "Image sizes"
          echo "========================================"

          ls -lh \
            "$EFI_IMAGE" \
            "$VMDK_IMAGE"


      # ============================================================
      # 24. Prepare artifacts
      # ============================================================

      - name: Prepare artifacts
        working-directory: ./immortalwrt

        run: |

          set -e

          TARGET_DIR="bin/targets/x86/64"

          rm -rf artifact

          mkdir -p \
            artifact/firmware \
            artifact/apk \
            artifact/buildinfo


          # ========================================================
          # EFI image
          # ========================================================

          EFI_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*combined-efi.img.gz' \
              -o \
              -name '*combined-efi.img' \
            \) \
            | head -n 1)"


          if [[ "$EFI_IMAGE" == *.gz ]]; then

            cp "$EFI_IMAGE" \
              "artifact/firmware/ImmortalWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img.gz"

          else

            cp "$EFI_IMAGE" \
              "artifact/firmware/ImmortalWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img"

          fi


          # ========================================================
          # VMDK
          # ========================================================

          VMDK_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.vmdk' \
            | head -n 1)"


          cp "$VMDK_IMAGE" \
            "artifact/firmware/ImmortalWrt-25.12-x86-64-ESXi-${BUILD_DATE}.vmdk"


          # ========================================================
          # SHA256
          # ========================================================

          cd artifact/firmware

          sha256sum * \
            > SHA256SUMS

          cd ../..


          # ========================================================
          # APK packages
          #
          # ImmortalWrt 25.12 may use APK package format.
          # Also collect IPK if generated.
          # ========================================================

          if [ -d bin/packages ]; then

            find bin/packages \
              -type f \
              \( \
                -name '*.apk' \
                -o \
                -name '*.ipk' \
              \) \
              -exec cp {} artifact/apk/ \;

          fi


          # ========================================================
          # Buildinfo / Manifest / BOM
          # ========================================================

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.buildinfo' \
              -o \
              -name '*.manifest' \
              -o \
              -name '*.bom.cdx.json' \
            \) \
            -exec cp {} artifact/buildinfo/ \;


          # ========================================================
          # Final .config
          # ========================================================

          cp .config \
            artifact/buildinfo/config.final


          # ========================================================
          # Source information
          # ========================================================

          git log -1 --format=fuller \
            > artifact/buildinfo/source.commit


          git describe --always --dirty \
            > artifact/buildinfo/source.version


          # ========================================================
          # Summary
          # ========================================================

          echo ""
          echo "========================================"
          echo "Firmware"
          echo "========================================"

          ls -lh artifact/firmware


          echo ""
          echo "========================================"
          echo "Packages"
          echo "========================================"

          find artifact/apk \
            -type f \
            -printf '%f\n' \
            | sort \
            || true


          echo ""
          echo "========================================"
          echo "Build information"
          echo "========================================"

          ls -lh artifact/buildinfo


      # ============================================================
      # 25. Upload firmware
      # ============================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12-x86-64-Firmware-${{ env.BUILD_DATE }}

          path: |
            ./immortalwrt/artifact/firmware/*

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # 26. Upload APK / IPK
      # ============================================================

      - name: Upload packages
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12-x86-64-Packages-${{ env.BUILD_DATE }}

          path: |
            ./immortalwrt/artifact/apk/*

          if-no-files-found: warn

          retention-days: 30


      # ============================================================
      # 27. Upload build information
      # ============================================================

      - name: Upload build information
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12-x86-64-BuildInfo-${{ env.BUILD_DATE }}

          path: |
            ./immortalwrt/artifact/buildinfo/*

          if-no-files-found: error

          retention-days: 30
