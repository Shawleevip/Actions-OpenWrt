name: ImmortalWrt 25.12.1 x86_64 Latest

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: immortalwrt/immortalwrt
  OPENWRT_BRANCH: v25.12.1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout ImmortalWrt
      # ============================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENWRT_REPO }}
          ref: ${{ env.OPENWRT_BRANCH }}
          path: openwrt
          fetch-depth: 1

      # ============================================================
      # 2. Free disk space
      # ============================================================
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          sudo docker image prune -af || true

          df -h

      # ============================================================
      # 3. Build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            lld \
            flex \
            bison \
            gawk \
            gettext \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pyelftools \
            rsync \
            unzip \
            wget \
            curl \
            git \
            jq \
            zstd \
            ccache

      # ============================================================
      # 4. Update official ImmortalWrt feeds
      #
      # IMPORTANT:
      # 不加入 small。
      #
      # ImmortalWrt 官方 feeds 只负责基础 OpenWrt packages。
      # 第三方最新版在后面单独覆盖。
      # ============================================================
      - name: Update official feeds
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 5. Fetch latest third-party sources
      #
      # 原则：
      #
      # OpenClash / Argon / Lucky / RTP2HTTPD
      # 每次直接从 upstream HEAD 获取。
      #
      # DAED / DAE：
      # 使用 sbwml/openwrt_helloworld 的 OpenWrt package。
      #
      # luci-app-daed / luci-app-dae
      # 同样从该 OpenWrt package feed 获取。
      # ============================================================
      - name: Fetch latest third-party sources
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          mkdir -p package/custom

          # --------------------------------------------------------
          # OpenClash
          # --------------------------------------------------------
          rm -rf package/custom/luci-app-openclash
          rm -rf package/custom/openclash-src

          git clone --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            package/custom/openclash-src

          OPENCLASH_COMMIT=$(git -C package/custom/openclash-src rev-parse HEAD)

          cp -a \
            package/custom/openclash-src/luci-app-openclash \
            package/custom/luci-app-openclash

          # --------------------------------------------------------
          # Argon
          # --------------------------------------------------------
          rm -rf package/custom/luci-theme-argon

          git clone --depth 1 -b master \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/custom/luci-theme-argon

          ARGON_COMMIT=$(git -C package/custom/luci-theme-argon rev-parse HEAD)

          # --------------------------------------------------------
          # Argon Config
          # --------------------------------------------------------
          rm -rf package/custom/luci-app-argon-config

          git clone --depth 1 -b master \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/custom/luci-app-argon-config

          ARGON_CONFIG_COMMIT=$(git -C package/custom/luci-app-argon-config rev-parse HEAD)

          # --------------------------------------------------------
          # Lucky
          # --------------------------------------------------------
          rm -rf package/custom/lucky

          git clone --depth 1 \
            https://github.com/gdy666/luci-app-lucky.git \
            package/custom/lucky

          LUCKY_COMMIT=$(git -C package/custom/lucky rev-parse HEAD)

          # --------------------------------------------------------
          # RTP2HTTPD
          # --------------------------------------------------------
          rm -rf package/custom/rtp2httpd

          git clone --depth 1 \
            https://github.com/stackia/rtp2httpd.git \
            package/custom/rtp2httpd

          RTP2HTTPD_COMMIT=$(git -C package/custom/rtp2httpd rev-parse HEAD)

          # --------------------------------------------------------
          # Save source commits
          # --------------------------------------------------------
          cat > /tmp/third-party-commits.txt <<EOF
          OpenClash=${OPENCLASH_COMMIT}
          Argon=${ARGON_COMMIT}
          ArgonConfig=${ARGON_CONFIG_COMMIT}
          Lucky=${LUCKY_COMMIT}
          RTP2HTTPD=${RTP2HTTPD_COMMIT}
          EOF

          echo
          echo "============================================================"
          echo "THIRD-PARTY SOURCE COMMITS"
          echo "============================================================"

          cat /tmp/third-party-commits.txt

      # ============================================================
      # 6. Install latest DAED / DAE OpenWrt package feed
      #
      # sbwml/openwrt_helloworld 当前明确包含：
      #
      # daed
      # dae
      # luci-app-daed
      # luci-app-dae
      #
      # 并针对 OpenWrt 24.10 / 25.12。
      # ============================================================
      - name: Add latest DAED DAE package feed
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          rm -rf package/custom/helloworld

          git clone --depth 1 \
            https://github.com/sbwml/openwrt_helloworld.git \
            package/custom/helloworld

          echo
          echo "============================================================"
          echo "DAED / DAE SOURCE COMMIT"
          echo "============================================================"

          git -C package/custom/helloworld log -1 \
            --format='%H %cd' --date=iso

          echo
          echo "============================================================"
          echo "DAED / DAE PACKAGE TREE"
          echo "============================================================"

          find package/custom/helloworld \
            -maxdepth 2 \
            -type f \
            \( \
              -path '*/daed/Makefile' \
              -o -path '*/dae/Makefile' \
              -o -path '*/luci-app-daed/Makefile' \
              -o -path '*/luci-app-dae/Makefile' \
            \) \
            -print

      # ============================================================
      # 7. Remove duplicate / old packages
      #
      # 非常重要。
      #
      # 防止 official feeds 中旧版本抢先进入 package index。
      # ============================================================
      - name: Remove duplicate old packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          # --------------------------------------------------------
          # LuCI third-party packages
          # --------------------------------------------------------
          rm -rf package/feeds/luci/luci-theme-argon
          rm -rf package/feeds/luci/luci-app-argon-config
          rm -rf package/feeds/luci/luci-app-openclash
          rm -rf package/feeds/luci/luci-app-lucky
          rm -rf package/feeds/luci/luci-app-dae
          rm -rf package/feeds/luci/luci-app-daed

          # --------------------------------------------------------
          # packages feed
          # --------------------------------------------------------
          rm -rf package/feeds/packages/dae
          rm -rf package/feeds/packages/daed
          rm -rf package/feeds/packages/lucky

          # --------------------------------------------------------
          # Remove possible stale custom copies
          # --------------------------------------------------------
          rm -rf package/custom/dae
          rm -rf package/custom/daed
          rm -rf package/custom/luci-app-dae
          rm -rf package/custom/luci-app-daed

          echo
          echo "Old duplicate packages removed."

      # ============================================================
      # 8. Link latest DAED / DAE packages
      #
      # 不复制、不猜 Makefile。
      # 直接使用 helloworld 中明确的 package directory。
      # ============================================================
      - name: Link DAED and DAE packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          for pkg in \
            daed \
            dae \
            luci-app-daed \
            luci-app-dae
          do
            if [ -d "package/custom/helloworld/$pkg" ]; then

              echo "Found package: $pkg"

              rm -rf "package/custom/$pkg"

              ln -s \
                "$(pwd)/package/custom/helloworld/$pkg" \
                "package/custom/$pkg"

            else

              echo "WARNING: package not found: $pkg"

            fi
          done

          echo
          echo "============================================================"
          echo "FINAL DAED / DAE PACKAGES"
          echo "============================================================"

          ls -ld \
            package/custom/daed \
            package/custom/dae \
            package/custom/luci-app-daed \
            package/custom/luci-app-dae \
            2>/dev/null || true

      # ============================================================
      # 9. Prepare RTP2HTTPD package
      # ============================================================
      - name: Prepare RTP2HTTPD package
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          RTP_MAKEFILE=$(find package/custom/rtp2httpd \
            -maxdepth 5 \
            -name Makefile \
            -type f | head -1)

          if [ -z "$RTP_MAKEFILE" ]; then
            echo "ERROR: RTP2HTTPD OpenWrt Makefile not found."
            exit 1
          fi

          RTP_DIR=$(dirname "$RTP_MAKEFILE")

          rm -rf package/custom/rtp2httpd-package

          mkdir -p package/custom/rtp2httpd-package

          cp -a \
            "$RTP_DIR"/. \
            package/custom/rtp2httpd-package/

      # ============================================================
      # 10. Configure kernel + packages
      #
      # 重点：
      #
      # DYNAMIC_FTRACE
      # BPF
      # BPF_JIT
      # KPROBES
      # BTF
      # NETKIT
      #
      # 为 DAED / DAE eBPF 做完整准备。
      # ============================================================
      - name: Configure kernel and packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y

          # ========================================================
          # eBPF / FTRACE
          # ========================================================

          CONFIG_KERNEL_BPF=y
          CONFIG_KERNEL_BPF_SYSCALL=y
          CONFIG_KERNEL_BPF_JIT=y

          CONFIG_KERNEL_FTRACE=y
          CONFIG_KERNEL_FUNCTION_TRACER=y
          CONFIG_KERNEL_DYNAMIC_FTRACE=y
          CONFIG_KERNEL_DYNAMIC_FTRACE_WITH_REGS=y
          CONFIG_KERNEL_FUNCTION_GRAPH_TRACER=y

          CONFIG_KERNEL_KPROBES=y
          CONFIG_KERNEL_KPROBE_EVENTS=y

          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y

          CONFIG_KERNEL_NET_INGRESS=y
          CONFIG_KERNEL_NET_EGRESS=y
          CONFIG_KERNEL_NETKIT=y

          # ========================================================
          # LuCI
          # ========================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          # ========================================================
          # OpenClash
          #
          # 编译进去，但不要求默认启用。
          # ========================================================

          CONFIG_PACKAGE_luci-app-openclash=y

          # ========================================================
          # Argon
          # ========================================================

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          # ========================================================
          # Lucky
          # ========================================================

          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_lucky=y

          # ========================================================
          # SQM
          # ========================================================

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y

          # ========================================================
          # WireGuard
          # ========================================================

          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y

          # ========================================================
          # DAE
          # ========================================================

          CONFIG_PACKAGE_dae=y
          CONFIG_PACKAGE_luci-app-dae=y

          # ========================================================
          # DAED
          #
          # 这次重点解决：
          # “编译后 DAED 仍然是旧版本”
          # ========================================================

          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y

          # ========================================================
          # RTP2HTTPD
          # ========================================================

          CONFIG_PACKAGE_rtp2httpd=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y

          # ========================================================
          # Compiler cache
          # ========================================================

          CONFIG_CCACHE=y
          EOF

          make defconfig

      # ============================================================
      # 11. Verify final OpenWrt .config
      # ============================================================
      - name: Verify final configuration
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "FINAL KERNEL CONFIG"
          echo "============================================================"

          grep -E \
            '^CONFIG_KERNEL_(BPF|BPF_SYSCALL|BPF_JIT|FTRACE|FUNCTION_TRACER|DYNAMIC_FTRACE|DYNAMIC_FTRACE_WITH_REGS|FUNCTION_GRAPH_TRACER|KPROBES|KPROBE_EVENTS|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES|NET_INGRESS|NET_EGRESS|NETKIT)=' \
            .config

          echo
          echo "============================================================"
          echo "FINAL PACKAGE CONFIG"
          echo "============================================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-theme-argon|luci-app-argon-config|luci-app-lucky|lucky|luci-app-sqm|sqm-scripts|luci-app-wireguard|wireguard-tools|kmod-wireguard|dae|luci-app-dae|daed|luci-app-daed|rtp2httpd|luci-app-rtp2httpd)=' \
            .config

      # ============================================================
      # 12. Verify package Makefiles and versions
      # ============================================================
      - name: Verify package versions before compile
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "PACKAGE MAKEFILE VERSIONS"
          echo "============================================================"

          for pkg in \
            package/custom/luci-app-openclash \
            package/custom/luci-theme-argon \
            package/custom/luci-app-argon-config \
            package/custom/lucky \
            package/custom/rtp2httpd-package \
            package/custom/daed \
            package/custom/dae \
            package/custom/luci-app-daed \
            package/custom/luci-app-dae
          do

            if [ -d "$pkg" ]; then

              echo
              echo "===== $pkg ====="

              find "$pkg" \
                -maxdepth 3 \
                -name Makefile \
                -type f \
                -exec grep -H -E \
                  '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' {} \; \
                || true

            fi

          done

      # ============================================================
      # 13. Verify DAED upstream package source
      #
      # 不允许悄悄使用老版本。
      # ============================================================
      - name: Verify DAED package source
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "DAED SOURCE VERIFICATION"
          echo "============================================================"

          if [ ! -d package/custom/daed ]; then
            echo "ERROR: DAED package directory does not exist."
            exit 1
          fi

          if [ ! -f package/custom/daed/Makefile ]; then
            echo "ERROR: DAED Makefile does not exist."
            exit 1
          fi

          grep -E \
            '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|PKG_SOURCE|PKG_SOURCE_URL|PKG_HASH):=' \
            package/custom/daed/Makefile \
            || true

          echo
          echo "DAED package Makefile:"
          sed -n '1,160p' package/custom/daed/Makefile

      # ============================================================
      # 14. Download
      # ============================================================
      - name: Download sources
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          make download -j$(nproc) V=s

      # ============================================================
      # 15. Compile
      # ============================================================
      - name: Compile
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          export CCACHE_DIR="$HOME/.ccache"
          export PATH="/usr/lib/ccache:$PATH"

          make -j$(nproc) V=s

      # ============================================================
      # 16. Verify actual generated packages
      #
      # 这是解决“编译时最新版，安装后老版本”的核心验证。
      # ============================================================
      - name: Verify generated package versions
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "GENERATED PACKAGES"
          echo "============================================================"

          find bin/packages \
            -type f \
            \( \
              -iname '*daed*.apk' \
              -o -iname '*dae*.apk' \
              -o -iname '*luci-app-daed*.apk' \
              -o -iname '*luci-app-dae*.apk' \
              -o -iname '*openclash*.apk' \
              -o -iname '*argon*.apk' \
              -o -iname '*lucky*.apk' \
              -o -iname '*rtp2httpd*.apk' \
            \) \
            -print | sort

          echo
          echo "============================================================"
          echo "DAED PACKAGE"
          echo "============================================================"

          find bin/packages \
            -type f \
            -iname 'daed*.apk' \
            -print | sort

          echo
          echo "============================================================"
          echo "LUCI DAED PACKAGE"
          echo "============================================================"

          find bin/packages \
            -type f \
            -iname 'luci-app-daed*.apk' \
            -print | sort

      # ============================================================
      # 17. Verify package index contains selected packages
      # ============================================================
      - name: Verify package indexes
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "APK PACKAGE INDEX"
          echo "============================================================"

          find bin/packages \
            -type f \
            \( \
              -name 'Packages.adb' \
              -o -name 'Packages.manifest' \
              -o -name 'Packages.gz' \
            \) \
            -print

          echo
          echo "DAED package files:"
          find bin/packages \
            -type f \
            -iname '*daed*.apk' \
            -print

          test -n "$(find bin/packages \
            -type f \
            -iname 'daed*.apk' \
            -print -quit)"

          test -n "$(find bin/packages \
            -type f \
            -iname 'luci-app-daed*.apk' \
            -print -quit)"

      # ============================================================
      # 18. Verify final kernel build configuration
      #
      # 注意：
      # 这里检查 Linux kernel 自己的 .config，
      # 不只是 OpenWrt 根目录 .config。
      # ============================================================
      - name: Verify final Linux kernel configuration
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "FINAL LINUX KERNEL CONFIG"
          echo "============================================================"

          KERNEL_CONFIG=$(find build_dir \
            -path '*/linux-x86_64/linux-*/.config' \
            -type f \
            | head -1)

          if [ -z "$KERNEL_CONFIG" ]; then
            echo "ERROR: Linux kernel .config not found."
            exit 1
          fi

          echo "Kernel config:"
          echo "$KERNEL_CONFIG"

          echo
          grep -E \
            '^CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|FTRACE|FUNCTION_TRACER|DYNAMIC_FTRACE|DYNAMIC_FTRACE_WITH_REGS|FUNCTION_GRAPH_TRACER|KPROBES|KPROBE_EVENTS|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES|NET_INGRESS|NET_EGRESS|NETKIT)=' \
            "$KERNEL_CONFIG"

          echo
          echo "============================================================"
          echo "MANDATORY CHECKS"
          echo "============================================================"

          REQUIRED_CONFIGS="
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_FTRACE=y
          CONFIG_FUNCTION_TRACER=y
          CONFIG_DYNAMIC_FTRACE=y
          CONFIG_DYNAMIC_FTRACE_WITH_REGS=y
          CONFIG_KPROBES=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_NETKIT=y
          "

          while IFS= read -r config; do
            [ -z "$config" ] && continue

            if ! grep -qx "$config" "$KERNEL_CONFIG"; then
              echo "ERROR: Missing kernel config: $config"
              exit 1
            fi

            echo "OK: $config"

          done <<EOF
          $REQUIRED_CONFIGS
          EOF

      # ============================================================
      # 19. Prepare release
      # ============================================================
      - name: Prepare release
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          mkdir -p release

          DATE=$(date -u +%Y%m%d-%H%M)
          VERSION="${OPENWRT_BRANCH#v}"

          IMAGE=$(find bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*combined-efi.img.gz' \
              -o -name '*combined-efi.img' \
            \) \
            | head -1)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: EFI image not found."
            exit 1
          fi

          case "$IMAGE" in

            *.img.gz)

              cp "$IMAGE" \
                "release/ImmortalWrt-${VERSION}-x86_64-efi-${DATE}.img.gz"

              ;;

            *.img)

              cp "$IMAGE" \
                "release/ImmortalWrt-${VERSION}-x86_64-efi-${DATE}.img"

              ;;

          esac

          # --------------------------------------------------------
          # Save final OpenWrt config
          # --------------------------------------------------------

          cp .config \
            "release/ImmortalWrt-${VERSION}-x86_64.config"

          # --------------------------------------------------------
          # Save source/version audit
          # --------------------------------------------------------

          cp /tmp/third-party-commits.txt \
            "release/third-party-commits.txt"

          echo
          echo "============================================================"
          echo "RELEASE FILES"
          echo "============================================================"

          ls -lh release/

      # ============================================================
      # 20. Upload artifact
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12.1-x86_64-efi
          path: openwrt/release/
          retention-days: 7
