name: ImmortalWrt 25.12 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTAL_REF: v25.12.1
  IMMORTAL_DIR: immortalwrt
  TZ: Asia/Shanghai

jobs:
  build:
    name: ImmortalWrt 25.12.1 x86_64
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Maximize build space
      # ==========================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ==========================================================
      # 3. Build dependencies
      # ==========================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo apt-get update

          sudo apt-get install -y \
            ack asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake \
            cpio curl device-tree-compiler flex gawk gcc-multilib \
            g++-multilib gettext genisoimage git gperf haveged help2man \
            intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip vim wget xmlto xxd \
            zlib1g-dev scdoc zstd

          sudo timedatectl set-timezone Asia/Shanghai


      # ==========================================================
      # 4. Build information
      # ==========================================================

      - name: Set build information
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"


      # ==========================================================
      # 5. CCache
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: immortalwrt-25.12-x86_64-${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/immortalwrt-25.12.yml') }}
          restore-keys: |
            immortalwrt-25.12-x86_64-${{ runner.os }}-ccache-


      # ==========================================================
      # 6. ImmortalWrt source
      # ==========================================================

      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$IMMORTAL_REF" \
            https://github.com/immortalwrt/immortalwrt.git \
            "$IMMORTAL_DIR"

          cd "$IMMORTAL_DIR"

          echo "========================================"
          echo "ImmortalWrt source"
          echo "========================================"
          git log -1 --oneline
          git describe --always --dirty
          echo "Release: $IMMORTAL_REF"


      # ==========================================================
      # 7. Download cache
      # ==========================================================

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: immortalwrt-25.12-x86_64-${{ runner.os }}-dl-${{ hashFiles('.github/workflows/immortalwrt-25.12.yml') }}
          restore-keys: |
            immortalwrt-25.12-x86_64-${{ runner.os }}-dl-


      # ==========================================================
      # 8. Third-party feeds
      # ==========================================================

      - name: Configure third-party feeds
        working-directory: ./immortalwrt
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          EOF

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          sed -i \
            -e '/^src-git passwall /d' \
            -e '/^src-git passwall_packages /d' \
            -e '/^src-git passwall2 /d' \
            feeds.conf.default


      # ==========================================================
      # 9. OpenClash
      # ==========================================================

      - name: Add latest OpenClash
        working-directory: ./immortalwrt
        run: |
          rm -rf /tmp/openclash package/luci-app-openclash

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/vernesong/OpenClash.git \
            /tmp/openclash

          cp -a \
            /tmp/openclash/luci-app-openclash \
            package/luci-app-openclash

          echo "===== OpenClash version ====="
          grep -E 'PKG_VERSION|PKG_RELEASE' \
            package/luci-app-openclash/Makefile || true


      # ==========================================================
      # 10. Lucky
      # ==========================================================

      - name: Add latest Lucky
        working-directory: ./immortalwrt
        run: |
          rm -rf \
            /tmp/lucky \
            package/lucky \
            package/luci-app-lucky

          git clone \
            --depth 1 \
            --branch main \
            https://github.com/sirpdboy/luci-app-lucky.git \
            /tmp/lucky

          cp -a /tmp/lucky/lucky \
            package/lucky

          cp -a /tmp/lucky/luci-app-lucky \
            package/luci-app-lucky


      # ==========================================================
      # 11. RTP2HTTPD
      #
      # Important:
      # Do NOT copy the repository root directly.
      # The official OpenWrt packages are under openwrt-support/.
      # ==========================================================

      - name: Add latest RTP2HTTPD
        working-directory: ./immortalwrt
        run: |
          rm -rf \
            /tmp/rtp2httpd \
            package/rtp2httpd \
            package/luci-app-rtp2httpd

          git clone \
            --depth 1 \
            --branch main \
            https://github.com/stackia/rtp2httpd.git \
            /tmp/rtp2httpd

          cp -a \
            /tmp/rtp2httpd/openwrt-support/rtp2httpd \
            package/rtp2httpd

          cp -a \
            /tmp/rtp2httpd/openwrt-support/luci-app-rtp2httpd \
            package/luci-app-rtp2httpd

          echo "===== RTP2HTTPD package version ====="
          grep -E 'PKG_VERSION|PKG_RELEASE' \
            package/rtp2httpd/Makefile || true

          echo "===== RTP2HTTPD LuCI version ====="
          grep -E 'PKG_VERSION|PKG_RELEASE' \
            package/luci-app-rtp2httpd/Makefile || true


      # ==========================================================
      # 12. Vlmcsd / KMS
      # ==========================================================

      - name: Add Vlmcsd
        working-directory: ./immortalwrt
        run: |
          rm -rf \
            /tmp/sbwml \
            package/vlmcsd \
            package/luci-app-vlmcsd

          git clone \
            --filter=blob:none \
            --no-checkout \
            --depth 1 \
            https://github.com/sbwml/openwrt_pkgs.git \
            /tmp/sbwml

          cd /tmp/sbwml

          git sparse-checkout init --cone

          git sparse-checkout set \
            vlmcsd \
            luci-app-vlmcsd

          git checkout

          cd -

          cp -a /tmp/sbwml/vlmcsd \
            package/vlmcsd

          cp -a /tmp/sbwml/luci-app-vlmcsd \
            package/luci-app-vlmcsd


      # ==========================================================
      # 13. Argon
      # ==========================================================

      - name: Add latest Argon
        working-directory: ./immortalwrt
        run: |
          rm -rf \
            package/luci-theme-argon \
            package/luci-app-argon-config

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config


      # ==========================================================
      # 14. Diskman
      # ==========================================================

      - name: Add latest Diskman
        working-directory: ./immortalwrt
        run: |
          rm -rf package/diskman

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/lisaac/luci-app-diskman.git \
            package/diskman


      # ==========================================================
      # 15. Package symlinks
      # ==========================================================

      - name: Prepare package symlinks
        working-directory: ./immortalwrt
        run: |
          make package/symlinks


      # ==========================================================
      # 16. Generate configuration
      # ==========================================================

      - name: Generate configuration
        working-directory: ./immortalwrt
        run: |
          rm -f .config

          cat > .config <<'EOF'

          # ======================================================
          # Target
          # ======================================================

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_GRUB_EFI_IMAGES=y


          # ======================================================
          # LuCI
          # ======================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y


          # ======================================================
          # IPv6
          # ======================================================

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y


          # ======================================================
          # Filesystems
          # ======================================================

          CONFIG_PACKAGE_kmod-fs-nfs=y
          CONFIG_PACKAGE_kmod-fs-nfs-common=y
          CONFIG_PACKAGE_kmod-fs-nfs-v3=y
          CONFIG_PACKAGE_kmod-fs-nfs-v4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y


          # ======================================================
          # USB
          # ======================================================

          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ohci-pci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb2-pci=y
          CONFIG_PACKAGE_kmod-usb3=y


          # ======================================================
          # Bonding
          # ======================================================

          CONFIG_PACKAGE_kmod-bonding=y


          # ======================================================
          # SQM / CAKE
          # ======================================================

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y


          # ======================================================
          # DAED
          #
          # Required kernel modules are built into firmware.
          # This avoids the previous APK dependency problem:
          #
          # kmod-sched-bpf
          # kmod-veth
          # kmod-xdp-sockets-diag
          # ======================================================

          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_daed-geoip=y
          CONFIG_PACKAGE_daed-geosite=y
          CONFIG_PACKAGE_luci-app-daed=y
          CONFIG_PACKAGE_luci-i18n-daed-zh-cn=y

          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y


          # ======================================================
          # OpenVPN
          # ======================================================

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y


          # ======================================================
          # WireGuard
          # ======================================================

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y


          # ======================================================
          # OpenClash
          # ======================================================

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y


          # ======================================================
          # PassWall2
          # ======================================================

          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y


          # ======================================================
          # Lucky
          # ======================================================

          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_lucky=y


          # ======================================================
          # RTP2HTTPD
          # ======================================================

          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          CONFIG_PACKAGE_rtp2httpd=y


          # ======================================================
          # Vlmcsd / KMS
          # ======================================================

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          # ======================================================
          # Argon
          # ======================================================

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y


          # ======================================================
          # Diskman
          # ======================================================

          CONFIG_PACKAGE_luci-app-diskman=y


          # ======================================================
          # UPnP / IGD / NAT-PMP / PCP
          # ======================================================

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y


          # ======================================================
          # IRQ Balance
          # ======================================================

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y


          # ======================================================
          # TTYD
          # ======================================================

          CONFIG_PACKAGE_luci-app-ttyd=y


          # ======================================================
          # Network / diagnostics
          # ======================================================

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y


          # ======================================================
          # ESXi
          # ======================================================

          CONFIG_PACKAGE_open-vm-tools=y


          # ======================================================
          # Firewall
          # ======================================================

          CONFIG_PACKAGE_firewall4=y


          # ======================================================
          # CCache
          # ======================================================

          CONFIG_CCACHE=y

          EOF

          make defconfig


      # ==========================================================
      # 17. Verify selected third-party packages
      # ==========================================================

      - name: Verify package versions
        working-directory: ./immortalwrt
        run: |
          echo "========================================"
          echo "OpenClash"
          echo "========================================"
          grep -E 'PKG_VERSION|PKG_RELEASE' \
            package/luci-app-openclash/Makefile || true

          echo ""
          echo "========================================"
          echo "RTP2HTTPD"
          echo "========================================"
          grep -R -E \
            'PKG_VERSION|PKG_RELEASE' \
            package/rtp2httpd \
            package/luci-app-rtp2httpd \
            2>/dev/null || true

          echo ""
          echo "========================================"
          echo "Lucky"
          echo "========================================"
          grep -R -E \
            'PKG_VERSION|PKG_RELEASE' \
            package/lucky \
            package/luci-app-lucky \
            2>/dev/null || true

          echo ""
          echo "========================================"
          echo "DAED"
          echo "========================================"
          grep -R -E \
            'PKG_VERSION|PKG_RELEASE' \
            package/feeds/*/daed \
            package/feeds/*/luci-app-daed \
            2>/dev/null || true


      # ==========================================================
      # 18. Check prerequisites
      # ==========================================================

      - name: Check prerequisites
        working-directory: ./immortalwrt
        run: |
          make prereq


      # ==========================================================
      # 19. Download sources
      # ==========================================================

      - name: Download sources
        working-directory: ./immortalwrt
        run: |
          make download -j8 V=s


      # ==========================================================
      # 20. Compile firmware
      # ==========================================================

      - name: Compile firmware
        working-directory: ./immortalwrt
        run: |
          echo "========================================"
          echo "ImmortalWrt 25.12.1 build started"
          echo "$BUILD_TIME"
          echo "========================================"

          make -j$(nproc) || make -j1 V=s

          echo "========================================"
          echo "ImmortalWrt 25.12.1 build finished"
          echo "========================================"

          date


      # ==========================================================
      # 21. Prepare firmware
      # ==========================================================

      - name: Prepare artifacts
        working-directory: ./immortalwrt
        run: |
          set -e

          TARGET="bin/targets/x86/64"

          rm -rf artifact

          mkdir -p \
            artifact/firmware \
            artifact/buildinfo

          EFI="$(
            find "$TARGET" \
              -maxdepth 1 \
              -type f \
              \( \
                -name '*generic-squashfs-combined-efi.img.gz' \
                -o \
                -name '*generic-ext4-combined-efi.img.gz' \
                -o \
                -name '*combined-efi.img.gz' \
              \) \
              | head -n 1
          )"

          test -n "$EFI"

          cp "$EFI" \
            "artifact/firmware/ImmortalWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img.gz"

          cd artifact/firmware

          sha256sum * > SHA256SUMS

          cd ../..

          cp .config \
            artifact/buildinfo/config.final

          git log -1 --format=fuller \
            > artifact/buildinfo/source.commit

          git describe --always --dirty \
            > artifact/buildinfo/source.version

          find "$TARGET" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.buildinfo' \
              -o \
              -name '*.manifest' \
              -o \
              -name '*.bom.cdx.json' \
            \) \
            -exec cp {} artifact/buildinfo/ \;

          echo ""
          echo "========================================"
          echo "Firmware"
          echo "========================================"

          ls -lh artifact/firmware

          echo ""
          echo "========================================"
          echo "BuildInfo"
          echo "========================================"

          ls -lh artifact/buildinfo


      # ==========================================================
      # 22. Upload firmware
      # ==========================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-x86-64-Firmware-${{ env.BUILD_DATE }}
          path: ./immortalwrt/artifact/firmware/*
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 23. Upload BuildInfo
      # ==========================================================

      - name: Upload BuildInfo
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-x86-64-BuildInfo-${{ env.BUILD_DATE }}
          path: ./immortalwrt/artifact/buildinfo/*
          if-no-files-found: error
          retention-days: 30
