name: ImmortalWrt 25.12 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTAL_BRANCH: openwrt-25.12
  IMMORTAL_DIR: immortalwrt
  TZ: Asia/Shanghai

jobs:

  build:

    name: ImmortalWrt 25.12 x86_64

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Maximize build space
      # ============================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ============================================================
      # 3. Build dependencies
      # ============================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive

        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc \
            zstd

          sudo timedatectl set-timezone Asia/Shanghai


      # ============================================================
      # 4. Build information
      # ============================================================

      - name: Set build information
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"


      # ============================================================
      # 5. CCache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: immortalwrt-25.12-x86_64-${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/immortalwrt-25.12.yml') }}
          restore-keys: |
            immortalwrt-25.12-x86_64-${{ runner.os }}-ccache-


      # ============================================================
      # 6. Clone ImmortalWrt
      # ============================================================

      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$IMMORTAL_BRANCH" \
            https://github.com/immortalwrt/immortalwrt.git \
            "$IMMORTAL_DIR"

          cd "$IMMORTAL_DIR"

          echo "========================================"
          echo "ImmortalWrt source"
          echo "========================================"

          git log -1 --oneline
          git describe --always --dirty


      # ============================================================
      # 7. Download cache
      # ============================================================

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: immortalwrt-25.12-x86_64-dl-${{ runner.os }}-${{ hashFiles('.github/workflows/immortalwrt-25.12.yml') }}
          restore-keys: |
            immortalwrt-25.12-x86_64-dl-${{ runner.os }}-


      # ============================================================
      # 8. Official feeds
      # ============================================================

      - name: Update official feeds
        working-directory: ./immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ============================================================
      # 9. OpenClash
      # ============================================================

      - name: Add OpenClash
        working-directory: ./immortalwrt
        run: |
          rm -rf /tmp/openclash
          rm -rf package/luci-app-openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/openclash

          cp -a \
            /tmp/openclash/luci-app-openclash \
            package/luci-app-openclash

          test -f package/luci-app-openclash/Makefile

          echo "OpenClash installed."


      # ============================================================
      # 10. PassWall2
      # ============================================================

      - name: Add PassWall2
        working-directory: ./immortalwrt
        run: |
          rm -rf /tmp/passwall2
          rm -rf package/passwall2

          git clone \
            --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
            /tmp/passwall2

          cp -a \
            /tmp/passwall2 \
            package/passwall2

          echo "PassWall2 installed."


      # ============================================================
      # 11. Lucky
      # ============================================================

      - name: Add Lucky
        working-directory: ./immortalwrt
        run: |
          rm -rf package/lucky

          git clone \
            --depth 1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky

          test -d package/lucky/luci-app-lucky
          test -d package/lucky/lucky

          echo "Lucky installed."


      # ============================================================
      # 12. RTP2HTTPD
      # ============================================================

      - name: Add RTP2HTTPD
        working-directory: ./immortalwrt
        run: |
          rm -rf package/rtp2httpd

          git clone \
            --depth 1 \
            https://github.com/stackia/rtp2httpd.git \
            package/rtp2httpd

          echo "RTP2HTTPD installed."


      # ============================================================
      # 13. Argon
      # ============================================================

      - name: Add Argon
        working-directory: ./immortalwrt
        run: |
          rm -rf \
            package/luci-theme-argon \
            package/luci-app-argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config

          test -f package/luci-theme-argon/Makefile
          test -f package/luci-app-argon-config/Makefile

          echo "Argon installed."


      # ============================================================
      # 14. Diskman
      # ============================================================

      - name: Add Diskman
        working-directory: ./immortalwrt
        run: |
          rm -rf package/diskman

          git clone \
            --depth 1 \
            https://github.com/lisaac/luci-app-diskman.git \
            package/diskman

          echo "Diskman installed."


      # ============================================================
      # 15. Vlmcsd
      #
      # Prefer official ImmortalWrt feed.
      # If unavailable, use sbwml/openwrt_pkgs.
      # ============================================================

      - name: Add Vlmcsd
        working-directory: ./immortalwrt
        run: |

          if grep -Rqs "Package/vlmcsd" feeds package 2>/dev/null && \
             grep -Rqs "Package/luci-app-vlmcsd" feeds package 2>/dev/null; then

            echo "Official Vlmcsd package found."

          else

            echo "Official Vlmcsd package not found."
            echo "Using sbwml/openwrt_pkgs fallback."

            rm -rf package/vlmcsd

            git clone \
              --filter=blob:none \
              --no-checkout \
              --depth 1 \
              https://github.com/sbwml/openwrt_pkgs.git \
              package/vlmcsd

            cd package/vlmcsd

            git sparse-checkout init --cone

            git sparse-checkout set \
              vlmcsd \
              luci-app-vlmcsd

            git checkout

            cd ../..

          fi


      # ============================================================
      # 16. Package symlinks
      # ============================================================

      - name: Prepare package symlinks
        working-directory: ./immortalwrt
        run: |
          make package/symlinks


      # ============================================================
      # 17. Generate configuration
      #
      # IMPORTANT:
      # Do NOT manually force TARGET_x86_64_Generic,
      # EFI_IMAGES or other legacy symbols.
      #
      # ImmortalWrt 25.12 generates target-specific configuration
      # through its own target system.
      # ============================================================

      - name: Generate configuration
        working-directory: ./immortalwrt
        run: |

          cat > .config <<'EOF'

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y

          CONFIG_PACKAGE_kmod-fs-nfs=y
          CONFIG_PACKAGE_kmod-fs-nfs-common=y
          CONFIG_PACKAGE_kmod-fs-nfs-v3=y
          CONFIG_PACKAGE_kmod-fs-nfs-v4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y

          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ohci-pci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb2-pci=y
          CONFIG_PACKAGE_kmod-usb3=y

          CONFIG_PACKAGE_kmod-bonding=y

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_luci-i18n-openvpn-zh-cn=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_unzip=y

          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y

          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y

          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          CONFIG_PACKAGE_luci-i18n-rtp2httpd-zh-cn=y

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y

          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-i18n-diskman-zh-cn=y

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y

          CONFIG_PACKAGE_open-vm-tools=y

          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          CONFIG_PACKAGE_firewall4=y

          CONFIG_CCACHE=y

          EOF

          make defconfig


      # ============================================================
      # 18. Verify final configuration
      #
      # Only check packages which are important to this build.
      # Do NOT check obsolete target/image symbols.
      # ============================================================

      - name: Verify final configuration
        working-directory: ./immortalwrt
        run: |

          set -e

          echo "========================================"
          echo "Final configuration"
          echo "========================================"

          grep -E \
            '^CONFIG_TARGET_x86(_64)?=' \
            .config || true

          echo ""

          required_packages=(
            "luci"
            "luci-ssl"
            "luci-i18n-base-zh-cn"
            "luci-app-openclash"
            "luci-app-passwall2"
            "luci-app-lucky"
            "luci-app-rtp2httpd"
            "luci-app-openvpn"
            "wireguard-tools"
            "luci-app-sqm"
            "luci-theme-argon"
            "luci-app-argon-config"
            "luci-app-diskman"
          )

          for pkg in "${required_packages[@]}"; do

            if grep -qx "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "[OK] $pkg"
            else
              echo "[ERROR] Missing: $pkg"
              exit 1
            fi

          done

          echo ""
          echo "Configuration verified."


      # ============================================================
      # 19. Prerequisites
      # ============================================================

      - name: Check prerequisites
        working-directory: ./immortalwrt
        run: |
          make prereq


      # ============================================================
      # 20. Download sources
      # ============================================================

      - name: Download sources
        working-directory: ./immortalwrt
        run: |
          make download -j8 V=s


      # ============================================================
      # 21. Compile
      # ============================================================

      - name: Compile firmware
        working-directory: ./immortalwrt
        run: |

          echo "========================================"
          echo "ImmortalWrt build started"
          echo "$BUILD_TIME"
          echo "========================================"

          make -j$(nproc) || make -j1 V=s

          echo "========================================"
          echo "ImmortalWrt build finished"
          echo "========================================"

          date


      # ============================================================
      # 22. Verify images
      # ============================================================

      - name: Verify firmware
        working-directory: ./immortalwrt
        run: |

          set -e

          TARGET_DIR="bin/targets/x86/64"

          echo "========================================"
          echo "Generated files"
          echo "========================================"

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo ""

          EFI_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*combined-efi.img.gz' \
              -o \
              -name '*combined-efi.img' \
            \) \
            | head -n 1)"

          VMDK_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.vmdk' \
            | head -n 1)"

          if [ -z "$EFI_IMAGE" ]; then
            echo "ERROR: EFI image not found."
            exit 1
          fi

          if [ -z "$VMDK_IMAGE" ]; then
            echo "ERROR: VMDK image not found."
            exit 1
          fi

          echo ""
          echo "EFI:"
          echo "$EFI_IMAGE"

          echo ""
          echo "VMDK:"
          echo "$VMDK_IMAGE"

          echo ""
          ls -lh "$EFI_IMAGE" "$VMDK_IMAGE"


      # ============================================================
      # 23. Prepare artifacts
      # ============================================================

      - name: Prepare artifacts
        working-directory: ./immortalwrt
        run: |

          set -e

          TARGET_DIR="bin/targets/x86/64"

          rm -rf artifact

          mkdir -p \
            artifact/firmware \
            artifact/packages \
            artifact/buildinfo


          # --------------------------------------------------------
          # EFI
          # --------------------------------------------------------

          EFI_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*combined-efi.img.gz' \
              -o \
              -name '*combined-efi.img' \
            \) \
            | head -n 1)"

          if [[ "$EFI_IMAGE" == *.gz ]]; then

            cp "$EFI_IMAGE" \
              "artifact/firmware/ImmortalWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img.gz"

          else

            cp "$EFI_IMAGE" \
              "artifact/firmware/ImmortalWrt-25.12-x86-64-UEFI-${BUILD_DATE}.img"

          fi


          # --------------------------------------------------------
          # VMDK
          # --------------------------------------------------------

          VMDK_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.vmdk' \
            | head -n 1)"

          cp "$VMDK_IMAGE" \
            "artifact/firmware/ImmortalWrt-25.12-x86-64-ESXi-${BUILD_DATE}.vmdk"


          # --------------------------------------------------------
          # SHA256
          # --------------------------------------------------------

          cd artifact/firmware

          sha256sum * > SHA256SUMS

          cd ../..


          # --------------------------------------------------------
          # APK / IPK packages
          # --------------------------------------------------------

          if [ -d bin/packages ]; then

            find bin/packages \
              -type f \
              \( \
                -name '*.apk' \
                -o \
                -name '*.ipk' \
              \) \
              -exec cp {} artifact/packages/ \;

          fi


          # --------------------------------------------------------
          # Build information
          # --------------------------------------------------------

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.buildinfo' \
              -o \
              -name '*.manifest' \
              -o \
              -name '*.bom.cdx.json' \
            \) \
            -exec cp {} artifact/buildinfo/ \;


          cp .config \
            artifact/buildinfo/config.final


          git log -1 --format=fuller \
            > artifact/buildinfo/source.commit

          git describe --always --dirty \
            > artifact/buildinfo/source.version


          echo ""
          echo "========================================"
          echo "Firmware"
          echo "========================================"

          ls -lh artifact/firmware

          echo ""
          echo "========================================"
          echo "Packages"
          echo "========================================"

          find artifact/packages \
            -type f \
            -printf '%f\n' \
            | sort || true

          echo ""
          echo "========================================"
          echo "Build information"
          echo "========================================"

          ls -lh artifact/buildinfo


      # ============================================================
      # 24. Upload firmware
      # ============================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-x86-64-Firmware-${{ env.BUILD_DATE }}
          path: |
            ./immortalwrt/artifact/firmware/*
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 25. Upload packages
      # ============================================================

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-x86-64-Packages-${{ env.BUILD_DATE }}
          path: |
            ./immortalwrt/artifact/packages/*
          if-no-files-found: warn
          retention-days: 30


      # ============================================================
      # 26. Upload build information
      # ============================================================

      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-x86-64-BuildInfo-${{ env.BUILD_DATE }}
          path: |
            ./immortalwrt/artifact/buildinfo/*
          if-no-files-found: error
          retention-days: 30
