name: ImmortalWrt 25.12.1 x86_64 Latest

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: immortalwrt/immortalwrt
  OPENWRT_BRANCH: v25.12.1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout ImmortalWrt
      # ============================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENWRT_REPO }}
          ref: ${{ env.OPENWRT_BRANCH }}
          path: openwrt
          fetch-depth: 1

      # ============================================================
      # 2. Free disk space
      # ============================================================
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune -af || true
          df -h

      # ============================================================
      # 3. Build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            lld \
            flex \
            bison \
            gawk \
            gettext \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pyelftools \
            rsync \
            unzip \
            wget \
            curl \
            git \
            jq \
            zstd \
            ccache

      # ============================================================
      # 4. Update ImmortalWrt official feeds
      #
      # 不加入 small。
      # 不使用旧的大杂烩 package snapshot。
      # ============================================================
      - name: Update feeds
        working-directory: ./openwrt
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 5. Fetch latest third-party packages
      #
      # 核心原则：
      #
      # 每次 workflow 都从上游 GitHub HEAD 获取最新源码。
      # 不依赖旧 feed 中缓存的 package。
      # ============================================================
      - name: Get latest third-party packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          mkdir -p package/custom

          # --------------------------------------------------------
          # OpenClash
          #
          # 官方 upstream:
          # https://github.com/vernesong/OpenClash
          #
          # OpenClash package 实际位于仓库：
          # luci-app-openclash/
          # --------------------------------------------------------
          rm -rf package/custom/luci-app-openclash
          git clone --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            package/custom/openclash-src

          rm -rf package/custom/luci-app-openclash
          cp -a \
            package/custom/openclash-src/luci-app-openclash \
            package/custom/luci-app-openclash

          rm -rf package/custom/openclash-src

          # --------------------------------------------------------
          # Argon
          # --------------------------------------------------------
          rm -rf package/custom/luci-theme-argon

          git clone --depth 1 -b master \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/custom/luci-theme-argon

          # --------------------------------------------------------
          # Argon Config
          # --------------------------------------------------------
          rm -rf package/custom/luci-app-argon-config

          git clone --depth 1 -b master \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/custom/luci-app-argon-config

          # --------------------------------------------------------
          # Lucky
          # --------------------------------------------------------
          rm -rf package/custom/lucky

          git clone --depth 1 \
            https://github.com/gdy666/luci-app-lucky.git \
            package/custom/lucky

          # --------------------------------------------------------
          # RTP2HTTPD
          #
          # 这里保留其独立 upstream source。
          # 后续由 package Makefile 构建。
          # --------------------------------------------------------
          rm -rf package/custom/rtp2httpd

          git clone --depth 1 \
            https://github.com/stackia/rtp2httpd.git \
            package/custom/rtp2httpd

          # --------------------------------------------------------
          # DAE
          #
          # 先取得最新 upstream。
          # --------------------------------------------------------
          rm -rf package/custom/dae-src

          git clone --depth 1 \
            https://github.com/daeuniverse/dae.git \
            package/custom/dae-src

          echo
          echo "============================================================"
          echo "THIRD PARTY SOURCE COMMITS"
          echo "============================================================"

          echo
          echo "[OpenClash]"
          git -C package/custom/openclash-src log -1 \
            --format='%H %cd' --date=iso 2>/dev/null || true

          echo
          echo "[Argon]"
          git -C package/custom/luci-theme-argon log -1 \
            --format='%H %cd' --date=iso

          echo
          echo "[Argon Config]"
          git -C package/custom/luci-app-argon-config log -1 \
            --format='%H %cd' --date=iso

          echo
          echo "[Lucky]"
          git -C package/custom/lucky log -1 \
            --format='%H %cd' --date=iso

          echo
          echo "[RTP2HTTPD]"
          git -C package/custom/rtp2httpd log -1 \
            --format='%H %cd' --date=iso

          echo
          echo "[DAE]"
          git -C package/custom/dae-src log -1 \
            --format='%H %cd' --date=iso

      # ============================================================
      # 6. Replace old LuCI packages from official feeds
      #
      # 防止 feeds 中已有的旧版本抢先安装。
      # ============================================================
      - name: Remove old duplicate packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          rm -rf package/feeds/luci/luci-theme-argon
          rm -rf package/feeds/luci/luci-app-argon-config
          rm -rf package/feeds/luci/luci-app-openclash

          # 如果旧 feeds 中存在这些第三方包，也删除。
          rm -rf package/feeds/packages/dae
          rm -rf package/feeds/luci/luci-app-dae
          rm -rf package/feeds/luci/luci-app-lucky
          rm -rf package/feeds/packages/lucky

      # ============================================================
      # 7. Locate DAE package
      #
      # 不假设 dae upstream 的目录结构。
      # 自动寻找 OpenWrt Makefile。
      # ============================================================
      - name: Prepare DAE package
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo "===== DAE SOURCE TREE ====="
          find package/custom/dae-src \
            -maxdepth 4 \
            -name Makefile \
            -print

          DAE_MAKEFILE=$(find package/custom/dae-src \
            -maxdepth 5 \
            -name Makefile \
            -type f | head -1)

          if [ -z "$DAE_MAKEFILE" ]; then
            echo "ERROR: DAE Makefile not found in upstream repository."
            exit 1
          fi

          DAE_DIR=$(dirname "$DAE_MAKEFILE")

          echo "DAE package directory:"
          echo "$DAE_DIR"

          mkdir -p package/custom/dae

          cp -a "$DAE_DIR"/. package/custom/dae/

          rm -rf package/custom/dae-src

      # ============================================================
      # 8. Prepare RTP2HTTPD package
      #
      # RTP2HTTPD upstream repository结构不假设。
      # 自动寻找 package Makefile。
      # ============================================================
      - name: Prepare RTP2HTTPD package
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo "===== RTP2HTTPD SOURCE TREE ====="

          find package/custom/rtp2httpd \
            -maxdepth 5 \
            -name Makefile \
            -print

          RTP_MAKEFILE=$(find package/custom/rtp2httpd \
            -maxdepth 5 \
            -name Makefile \
            -type f | head -1)

          if [ -z "$RTP_MAKEFILE" ]; then
            echo "ERROR: RTP2HTTPD upstream does not contain an OpenWrt Makefile."
            echo "The source repository alone cannot be used as an OpenWrt package."
            exit 1
          fi

          RTP_DIR=$(dirname "$RTP_MAKEFILE")

          echo "RTP2HTTPD package directory:"
          echo "$RTP_DIR"

          mkdir -p package/custom/rtp2httpd-package

          cp -a "$RTP_DIR"/. \
            package/custom/rtp2httpd-package/

      # ============================================================
      # 9. Kernel configuration
      #
      # 关键：
      # CONFIG_DYNAMIC_FTRACE
      #
      # 解决当前 6.12.94：
      # available_tracers = nop
      #
      # 目标：
      # dae eBPF fentry 能够正常 attach。
      # ============================================================
      - name: Configure kernel and packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y

          CONFIG_KERNEL_FTRACE=y
          CONFIG_KERNEL_FUNCTION_TRACER=y
          CONFIG_KERNEL_DYNAMIC_FTRACE=y
          CONFIG_KERNEL_DYNAMIC_FTRACE_WITH_REGS=y
          CONFIG_KERNEL_FUNCTION_GRAPH_TRACER=y

          CONFIG_KERNEL_KPROBES=y
          CONFIG_KERNEL_KPROBE_EVENTS=y

          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y

          CONFIG_KERNEL_NETKIT=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_lucky=y

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y

          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y

          CONFIG_PACKAGE_dae=y
          CONFIG_PACKAGE_luci-app-dae=y

          CONFIG_PACKAGE_rtp2httpd=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y

          CONFIG_CCACHE=y
          EOF

          make defconfig

      # ============================================================
      # 10. Verify important config
      # ============================================================
      - name: Verify kernel configuration
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo "===== KERNEL CONFIG ====="

          grep -E \
            '^CONFIG_KERNEL_(FTRACE|FUNCTION_TRACER|DYNAMIC_FTRACE|DYNAMIC_FTRACE_WITH_REGS|FUNCTION_GRAPH_TRACER|KPROBES|KPROBE_EVENTS|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES|NETKIT)=' \
            .config

          echo
          echo "===== PACKAGE CONFIG ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-theme-argon|luci-app-argon-config|luci-app-lucky|lucky|luci-app-sqm|sqm-scripts|luci-app-wireguard|wireguard-tools|kmod-wireguard|dae|luci-app-dae|rtp2httpd|luci-app-rtp2httpd)=' \
            .config || true

      # ============================================================
      # 11. Verify OpenClash version BEFORE compile
      # ============================================================
      - name: Verify upstream package versions
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo "===== OPENCLASH ====="
          grep -E \
            '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' \
            package/custom/luci-app-openclash/Makefile || true

          echo
          echo "===== ARGON ====="
          grep -E \
            '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' \
            package/custom/luci-theme-argon/Makefile || true

          echo
          echo "===== ARGON CONFIG ====="
          grep -E \
            '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' \
            package/custom/luci-app-argon-config/Makefile || true

          echo
          echo "===== LUCKY ====="
          find package/custom/lucky \
            -name Makefile \
            -maxdepth 4 \
            -exec grep -H -E \
              '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' {} \; \
            || true

          echo
          echo "===== RTP2HTTPD ====="
          find package/custom/rtp2httpd-package \
            -name Makefile \
            -maxdepth 4 \
            -exec grep -H -E \
              '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' {} \; \
            || true

          echo
          echo "===== DAE ====="
          find package/custom/dae \
            -name Makefile \
            -maxdepth 5 \
            -exec grep -H -E \
              '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' {} \; \
            || true

      # ============================================================
      # 12. Download
      # ============================================================
      - name: Download sources
        working-directory: ./openwrt
        run: |
          make download -j$(nproc) V=s

      # ============================================================
      # 13. Compile
      # ============================================================
      - name: Compile
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          export CCACHE_DIR="$HOME/.ccache"
          export PATH="/usr/lib/ccache:$PATH"

          make -j$(nproc) V=s

      # ============================================================
      # 14. Verify generated packages
      # ============================================================
      - name: Verify generated packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "GENERATED THIRD-PARTY PACKAGES"
          echo "============================================================"

          find bin/packages -type f \
            \( \
              -iname '*openclash*.ipk' \
              -o -iname '*openclash*.apk' \
              -o -iname '*argon*.ipk' \
              -o -iname '*argon*.apk' \
              -o -iname '*lucky*.ipk' \
              -o -iname '*lucky*.apk' \
              -o -iname '*rtp2httpd*.ipk' \
              -o -iname '*rtp2httpd*.apk' \
              -o -iname '*dae*.ipk' \
              -o -iname '*dae*.apk' \
            \) \
            -print | sort

      # ============================================================
      # 15. Verify EFI image
      # ============================================================
      - name: Prepare release
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          mkdir -p release

          DATE=$(date -u +%Y%m%d-%H%M)
          VERSION="${OPENWRT_BRANCH#v}"

          IMAGE=$(find bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*combined-efi.img.gz' \
              -o -name '*combined-efi.img' \
            \) \
            | head -1)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: EFI image not found."
            exit 1
          fi

          case "$IMAGE" in
            *.img.gz)
              cp "$IMAGE" \
                "release/ImmortalWrt-${VERSION}-x86_64-efi-${DATE}.img.gz"
              ;;
            *.img)
              cp "$IMAGE" \
                "release/ImmortalWrt-${VERSION}-x86_64-efi-${DATE}.img"
              ;;
          esac

          cp .config \
            "release/ImmortalWrt-${VERSION}-x86_64.config"

          echo
          echo "===== RELEASE FILES ====="
          ls -lh release/

      # ============================================================
      # 16. Upload artifact
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12.1-x86_64-efi
          path: openwrt/release/
          retention-days: 7
