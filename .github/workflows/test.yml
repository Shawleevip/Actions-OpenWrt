name: ImmortalWrt x86 Build
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    name: Job1‑Prepare Source & Feeds
    strategy:
      fail-fast: false
      matrix:
        target: [25.12]
    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get update
          sudo apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gcc-multilib g++-multilib gettext git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd scdoc genisoimage
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Set date env
        id: date
        run: |
          echo "date=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt openwrt

      - name: Cache dl
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: immortalwrt-dl-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: immortalwrt-dl-

      - name: Feeds modify & install custom packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight package/custom
          sed -i '/src-git kenzo/d' feeds.conf.default
          sed -i '/src-git small/d' feeds.conf.default
          sed -i '1i src-git small https://github.com/kenzok8/small' feeds.conf.default
          sed -i '1i src-git kenzo https://github.com/kenzok8/openwrt-packages' feeds.conf.default
          ./scripts/feeds update -a 2>&1 | tee preflight/feeds-update.log
          rm -rf feeds/small/*fchomo* feeds/kenzo/*fchomo* feeds/small/net/rtp2httpd
          rm -rf feeds/luci/applications/luci-app-mosdns feeds/luci/applications/luci-app-dae feeds/luci/applications/luci-app-daed
          rm -rf feeds/packages/net/alist feeds/packages/net/adguardhome feeds/packages/net/mosdns feeds/packages/net/xray* feeds/packages/net/v2ray-core feeds/packages/utils/v2dat feeds/packages/lang/golang
          git clone --depth 1 -b 1.26 https://github.com/kenzok8/golang.git feeds/packages/lang/golang
          ./scripts/feeds install -a
          git clone --depth 1 https://github.com/stackia/rtp2httpd.git /tmp/rtp2httpd
          cp -a /tmp/rtp2httpd/openwrt-support/* package/custom/
          rm -rf package/feeds/small/rtp2httpd
          git clone --depth 1 https://github.com/kenzok8/openwrt-daede.git /tmp/openwrt-daede
          cp -a /tmp/openwrt-daede/dae package/custom/dae
          cp -a /tmp/openwrt-daede/daed package/custom/daed
          cp -a /tmp/openwrt-daede/luci-app-daede package/custom/luci-app-daede
          cp -a /tmp/openwrt-daede/vmlinux-btf package/custom/vmlinux-btf
          rm -rf package/lucky package/feeds/*/lucky
          git clone --depth 1 https://github.com/sirpdboy/luci-app-lucky.git package/custom/lucky
          rm -rf package/custom/luci-app-openclash
          git clone --depth 1 -b master https://github.com/vernesong/OpenClash.git /tmp/openclash
          cp -a /tmp/openclash/luci-app-openclash package/custom/luci-app-openclash
          rm -rf package/feeds/kenzo/luci-app-dockerman package/feeds/small/trojan package/feeds/small/trojan-plus
          find package feeds -iname '*fchomo*' -exec rm -rf {} + 2>/dev/null || true

      - name: Compress whole openwrt source tree
        run: |
          tar -zcf openwrt-source-stage1.tar.gz openwrt

      - name: Upload stage1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-stage1
          path: openwrt-source-stage1.tar.gz
          retention-days: 3

  configgen:
    needs: prepare
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    name: Job2‑Generate .config
    strategy:
      fail-fast: false
      matrix:
        target: [25.12]
    steps:
      - uses: actions/checkout@v4
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install minimal deps
        run: |
          sudo apt update
          sudo apt install -y build-essential clang cmake libncurses-dev flex bison git

      - name: Download stage1 source
        uses: actions/download-artifact@v4
        with:
          name: source-stage1

      - name: Unpack source
        run: |
          tar -zxf openwrt-source-stage1.tar.gz

      - name: Argon theme
        working-directory: ./openwrt
        run: |
          set -euo pipefail
          rm -rf package/feeds/luci/luci-theme-argon package/feeds/luci/luci-app-argon-config
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/custom/luci-theme-argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/custom/luci-app-argon-config

      - name: Write system timezone & .config
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight package/base-files/files/etc/config
          rm -f ./.config*
          touch ./.config
          cat > package/base-files/files/etc/config/system <<'SHEOF'
          mkdir -p package/base-files/files/etc/config
          if [ -f package/base-files/files/etc/config/system ]; then
            sed -i "s/^[[:space:]]*option timezone.*/\toption timezone 'CST-8'/" package/base-files/files/etc/config/system
            sed -i "s/^[[:space:]]*option zonename.*/\toption zonename 'Asia\/Shanghai'/" package/base-files/files/etc/config/system
          else
          cat > package/base-files/files/etc/config/system <<'SHEOF'
           config system
            option hostname 'OpenWrt'
            option timezone 'CST-8'
            option zonename 'Asia/Shanghai'
            SHEOF
          fi

          cat >> .config <<'CFGEOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y
          CFGEOF

          cat >> .config <<'CFGEOF'
          CONFIG_DEVEL=y
          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_KERNEL_BPF_EVENTS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y
          CONFIG_KERNEL_KPROBES=y
          CONFIG_KERNEL_KPROBE_EVENTS=y
          CONFIG_KERNEL_XDP_SOCKETS=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONFIG_PACKAGE_kmod-veth=y
          CFGEOF

          cat >> .config <<'CFGEOF'
          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-nft-nat6=y
          CFGEOF

          cat >> .config <<'CFGEOF'
          CONFIG_PACKAGE_kmod-bonding=y
          CONFIG_PACKAGE_proto-bonding=y
          CONFIG_PACKAGE_luci-proto-bonding=y
          CFGEOF

          cat >> .config <<'CFGEOF'
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-app-filebrowser=n
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y
          CFGEOF

          cat >> .config <<'CFGEOF'
          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          CFGEOF
          
          cat >> .config <<'CFGEOF'
          #CONFIG_PACKAGE_luci-app-ssr-plus=n
          #CONFIG_PACKAGE_luci-app-passwall=n
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-openclash=y
          #CONFIG_PACKAGE_luci-app-mihomo=n
          #CONFIG_PACKAGE_luci-app-homeproxy=n
          #CONFIG_PACKAGE_luci-app-fchomo=n
          CFGEOF

          cat >> .config <<'CFGEOF'
          CONFIG_PACKAGE_dae=y
          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daede=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          CFGEOF

          cat >> .config <<'CFGEOF'
          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y
          CCONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CFGEOF
          
          cat >> .config <<'CFGEOF'
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CFGEOF

          cat >> .config <<'CFGEOF'
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_SOCAT_SSL=y
          CONFIG_SING_BOX_WITH_ECH=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_open-vm-tools=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_irqbalance=y
          CFGEOF

          make defconfig 2>&1 | tee preflight/defconfig.log


      - name: Pack stage2 source
        run: tar -zcf openwrt-source-stage2.tar.gz openwrt

      - name: Upload stage2
        uses: actions/upload-artifact@v4
        with:
          name: source-stage2
          path: openwrt-source-stage2.tar.gz
          retention-days: 5

  build:
    needs: configgen
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    name: Job3‑Compile Firmware
    strategy:
      fail-fast: false
      matrix:
        target: [25.12]
    steps:
      - uses: actions/checkout@v4
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 6144
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Download stage2 source
        uses: actions/download-artifact@v4
        with:
          name: source-stage2

      - name: Unpack source
        run: tar -zxf openwrt-source-stage2.tar.gz

      - name: Get date
        id: date
        run: echo "date=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Compile
        working-directory: ./openwrt
        shell: bash
        run: |
          set -o pipefail
          make download -j8
          make -j$(nproc) 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log

      - name: Get kernel version
        working-directory: ./openwrt
        run: |
          KERNEL_MAKEFILE=$(find build_dir -path '*/linux-x86_64/linux-*/Makefile' -type f | head -1)
          VERSION=$(grep '^VERSION = ' "$KERNEL_MAKEFILE" | awk '{print $3}')
          PATCHLEVEL=$(grep '^PATCHLEVEL = ' "$KERNEL_MAKEFILE" | awk '{print $3}')
          SUBLEVEL=$(grep '^SUBLEVEL = ' "$KERNEL_MAKEFILE" | awk '{print $3}')
          KERNEL_VERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

      - name: Prepare artifacts
        working-directory: ./openwrt
        run: |
          mkdir -p artifact/firmware artifact/package artifact/buildinfo
          find ./bin/targets/ -type f -name "*kernel.bin" -delete
          find ./bin/targets/ -type f -name "*squashfs-rootfs.img.gz" -delete
          find ./bin/targets/ -type d -name "packages" -prune -exec rm -rf {} +
          cp $(find ./bin/targets/ -type f -name "*combined-efi.img.gz") ./artifact/firmware/
          cp $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/
          cp $(find ./bin/targets/ -type f \( -name "*.buildinfo" -o -name "*.manifest" \)) ./artifact/buildinfo/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date }}‑firmware
          path: ./openwrt/artifact/firmware
          retention-days: 30

      - name: Upload ipk packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date }}‑ipks
          path: ./openwrt/artifact/package
          retention-days: 30

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date }}‑buildinfo
          path: ./openwrt/artifact/buildinfo
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ImmortalWrt‑${{ env.date }}
          name: ImmortalWrt 25.12 x86_64 ${{ env.date }}
          body: |
            **Kernel:** ${{ env.KERNEL_VERSION }}
            **Build Time:** ${{ env.date }} Beijing
            Platform: x86_64‑Generic EFI
          files: |
            ./openwrt/artifact/firmware/*
            ./openwrt/artifact/buildinfo/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old runs
        uses: Mattraks/delete-workflow-runs@v2
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 20
          keep_minimum_runs: 3
